- name: "bootstrap — ds4-c-iq2xxs: toolbox + model downloads (ds4.c engine + IQ2XXS quant)"
  hosts: ds4-c-iq2xxs
  gather_facts: yes
  become: yes
  tags: [ds4-c-iq2xxs]

  vars:
    # ds4_c_iq2xxs_mode / ds4_c_iq2xxs_ctx(_single) / ds4_c_iq2xxs_coord_port / ds4_c_iq2xxs_download_* defaults live in
    # inventory/group_vars/all.yml. Structural paths + model filenames + toolbox
    # images are also group_vars (single source of truth shared with the render play).
    ds4_c_iq2xxs_single_url: "https://huggingface.co/antirez/deepseek-v4-gguf/resolve/main/{{ ds4_c_iq2xxs_single_model }}"
    ds4_c_iq2xxs_multi_url: "https://huggingface.co/antirez/deepseek-v4-gguf/resolve/main/{{ ds4_c_iq2xxs_multi_model }}"
    ds4_c_iq2xxs_mtp_url: "https://huggingface.co/antirez/deepseek-v4-gguf/resolve/main/{{ ds4_c_iq2xxs_mtp_model }}"

  tasks:
    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ ds4_c_iq2xxs_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    - name: Create ds4 toolbox, multi-node image (distrobox)
      ansible.builtin.command:
        cmd: >-
          distrobox create --name ds4-c-iq2xxs-multi-node-rocm-7.14 --image {{ ds4_c_iq2xxs_toolbox_multi }} --additional-flags
          "--device /dev/dri --device /dev/kfd --group-add video --group-add render
          --group-add sudo --security-opt seccomp=unconfined"
      become: no
      changed_when: false
      failed_when: false
      when: ds4_c_iq2xxs_mode == "multi"
      tags: [toolbox]

    - name: Create ds4 toolbox, single-node image (distrobox)
      ansible.builtin.command:
        cmd: >-
          distrobox create --name ds4-c-iq2xxs-rocm-7.14 --image {{ ds4_c_iq2xxs_toolbox_single }} --additional-flags
          "--device /dev/dri --device /dev/kfd --group-add video --group-add render
          --group-add sudo --security-opt seccomp=unconfined"
      become: no
      changed_when: false
      failed_when: false
      when: ds4_c_iq2xxs_mode == "single"
      tags: [toolbox]

    - name: Download single-node IQ2_XXS imatrix model
      ansible.builtin.command:
        cmd: >-
          hf download antirez/deepseek-v4-gguf {{ ds4_c_iq2xxs_single_model }}
          --local-dir {{ ds4_c_iq2xxs_models_dir }}
          --token {{ lookup('file', '/home/jdella/Desktop/scripts/rocm-install-z1a-g2/hf_token.txt') }}
      become: no
      changed_when: false
      when: ds4_c_iq2xxs_download_single | int == 1
      tags: [model]

    - name: Download multi-node Q4KExperts imatrix model
      ansible.builtin.command:
        cmd: >-
          hf download antirez/deepseek-v4-gguf {{ ds4_c_iq2xxs_multi_model }}
          --local-dir {{ ds4_c_iq2xxs_models_dir }}
          --token {{ lookup('file', '/home/jdella/Desktop/scripts/rocm-install-z1a-g2/hf_token.txt') }}
      become: no
      changed_when: false
      when: ds4_c_iq2xxs_download_multi | int == 1
      tags: [model]

    - name: Download MTP speculative-decoding weights (optional, off by default)
      ansible.builtin.command:
        cmd: >-
          hf download antirez/deepseek-v4-gguf {{ ds4_c_iq2xxs_mtp_model }}
          --local-dir {{ ds4_c_iq2xxs_models_dir }}
          --token {{ lookup('file', '/home/jdella/Desktop/scripts/rocm-install-z1a-g2/hf_token.txt') }}
      become: no
      changed_when: false
      when: ds4_c_iq2xxs_download_mtp | int == 1
      tags: [model]

    - name: Check single-node IQ2_XXS model present
      ansible.builtin.find:
        paths: "{{ ds4_c_iq2xxs_models_dir }}"
        patterns: "*IQ2XXS*imatrix*"
      register: ds4_c_iq2xxs_single_files
      become: no
      tags: [model]

    - name: Check multi-node Q4KExperts model present
      ansible.builtin.find:
        paths: "{{ ds4_c_iq2xxs_models_dir }}"
        patterns: "*Q4KExperts*imatrix*"
      register: ds4_c_iq2xxs_multi_files
      become: no
      tags: [model]

    - name: Warn if model files are incomplete
      ansible.builtin.debug:
        msg: "WARNING [model] expected GGUF not found in {{ ds4_c_iq2xxs_models_dir }} — re-run download."
      when: >-
        (ds4_c_iq2xxs_mode == 'single' and ds4_c_iq2xxs_single_files.matched | int == 0) or
        (ds4_c_iq2xxs_mode == 'multi' and ds4_c_iq2xxs_multi_files.matched | int == 0)
      tags: [model]

    - name: Warn on multi-node that all nodes must share ctx and model
      ansible.builtin.debug:
        msg: |
          WARNING [multi] all nodes must use the SAME --ctx ({{ ds4_c_iq2xxs_ctx }}) and the SAME
          Q4KExperts GGUF. Coordinator listens on its IP; workers point --coordinator
          at it. Verify firewalls allow the coordinator port ({{ ds4_c_iq2xxs_coord_port }}).
      when: ds4_c_iq2xxs_mode == "multi"
      tags: [info]

    - name: Print ds4-c-iq2xxs track summary
      ansible.builtin.debug:
        msg: |
          ==== ds4-c-iq2xxs track complete on {{ inventory_hostname }} ====
          mode: {{ ds4_c_iq2xxs_mode }}  models in {{ ds4_c_iq2xxs_models_dir }}
          Launch later via scripts/ds4-c-iq2xxs-start.sh (DS4_C_IQ2XXS_ROLE=single|coordinator|worker).
          Single-node: IQ2_XXS at {{ ds4_c_iq2xxs_ctx_single }} ctx (AMD guide default).
          MTP disabled by default; set DS4_C_IQ2XXS_USE_MTP=1 to enable.
      tags: [info]

# -----------------------------------------------------------------------------
# Launch render — drop local ds4-c-iq2xxs launch script + pi config
# -----------------------------------------------------------------------------
- name: "bootstrap — drop local ds4-c-iq2xxs launch script + pi config"
  hosts: ds4-c-iq2xxs
  gather_facts: yes   # local/controller render; facts supply ansible_date_time for templates
  become: no
  run_once: yes
  tags: [launch, ds4-c-iq2xxs]

  tasks:
    - name: Render ds4-c-iq2xxs-start.sh launch script into ansible/rendered/scripts/
      ansible.builtin.template:
        src: templates/ds4-c-iq2xxs-start.sh.j2
        dest: "{{ playbook_dir }}/rendered/scripts/ds4-c-iq2xxs-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch]

    - name: Render pi agent config (pi-ds4-c-iq2xxs.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-ds4-c-iq2xxs.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-ds4-c-iq2xxs.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch]

    - name: Warn if coordinator IP not supplied (multi-node only)
      ansible.builtin.debug:
        msg: "WARNING [multi] ds4_c_iq2xxs_coord_ip is empty — set it (coordinator LAN IP) so workers connect and the pi config points at the right server."
      delegate_to: localhost
      when: ds4_c_iq2xxs_mode == "multi" and (ds4_c_iq2xxs_coord_ip | length == 0)
      tags: [info]
