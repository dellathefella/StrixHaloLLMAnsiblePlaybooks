- name: "bootstrap — ornith15: llama.cpp source build + Ornith-1.5-35B-A3B Q8_0"
  hosts: llama
  gather_facts: yes
  become: yes
  tags: [llama]

  vars:
    llama_repo_url: "https://github.com/ggml-org/llama.cpp.git"
    ornith15_url: "https://huggingface.co/{{ ornith15_repo }}/resolve/main/{{ ornith15_model }}"

  tasks:
    - name: Include ROCm build dependencies
      ansible.builtin.include_tasks:
        file: tasks/rocm-build-deps.yml
      tags: [packages, rocm]

    - name: Clone latest llama.cpp (HEAD)
      ansible.builtin.git:
        repo: "{{ llama_repo_url }}"
        dest: "{{ llama_repo }}"
        depth: 1
        version: HEAD
        force: yes
      become: no

    - name: Configure build — ROCm backend, release, graphs for PP perf
      ansible.builtin.command:
        cmd: >-
          cmake -B build -DGGML_HIP=ON -DGGML_HIP_GRAPHS=ON
          -DGGML_VULKAN=OFF
          -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          -DCMAKE_INSTALL_PREFIX={{ llama_prefix }}
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Build all targets (parallel)
      ansible.builtin.command:
        cmd: "cmake --build build --config Release -j{{ ansible_processor_vcpus | default(16) }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Install to {{ llama_prefix }} (full install)
      # Full cmake --install needs every target built (it references test
      # binaries like test-tokenizer-0); build above covers all of them.
      ansible.builtin.command:
        cmd: "cmake --install build --prefix {{ llama_prefix }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Verify llama-server binary
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_bin_stat
      tags: [build]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [llama] llama-server missing at {{ llama_bin }} — build failed. Check the cmake/build logs in {{ llama_repo }}/build."
      when: not llama_bin_stat.stat.exists

    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ llama_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    - name: Check if Ornith-1.5 model already present
      ansible.builtin.stat:
        path: "{{ llama_models_dir }}/{{ ornith15_model }}"
      register: ornith15_stat
      become: no
      tags: [model, ornith15]

    - name: Download Ornith-1.5-35B-A3B Q8_0 ({{ ornith15_model }}) [skip if present]
      ansible.builtin.command:
        cmd: >-
          aria2c -x 16 -s 16 --file-allocation=none
          --continue=true --allow-overwrite=true
          -o {{ ornith15_model }}
          {{ ornith15_url }}
      args:
        chdir: "{{ llama_models_dir }}"
      become: no
      changed_when: false
      when: not ornith15_stat.stat.exists
      tags: [model, ornith15]

    - name: Ornith-1.5 model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [ornith15] {{ ornith15_model }} already in {{ llama_models_dir }}"
      when: ornith15_stat.stat.exists
      tags: [model, ornith15]

    - name: Check downloaded model files present
      ansible.builtin.find:
        paths: "{{ llama_models_dir }}"
        patterns: "*.gguf"
      register: model_files
      become: no
      tags: [model, ornith15]

    - name: Warn if model downloads are incomplete
      ansible.builtin.debug:
        msg: "WARNING [model] expected 1 GGUF(s) missing in {{ llama_models_dir }} — re-run download."
      when: not (model_files.matched | int >= 1)
      tags: [model, ornith15]

    - name: Print ornith15 track summary
      ansible.builtin.debug:
        msg: |
          ==== ornith15 track complete on {{ inventory_hostname }} ====
          engine: {{ llama_bin }}
          model: {{ ornith15_model }}  ({{ ornith15_ctx }} ctx, port {{ ornith15_port }})
          Launch later via scripts/ornith15-start.sh.
          ROCm backend — 4.7x faster PP, 65% less energy than Vulkan.
      tags: [info]

# -----------------------------------------------------------------------------
# Launch render — drop local ornith15 launch script + pi config
# -----------------------------------------------------------------------------
- name: "bootstrap — drop local ornith15 launch script & pi config"
  hosts: llama
  gather_facts: yes
  become: no
  run_once: yes
  tags: [launch, llama]

  tasks:
    - name: Render ornith15-start.sh launch script into scripts/
      ansible.builtin.template:
        src: templates/ornith15-start.sh.j2
        dest: "{{ playbook_dir }}/../scripts/ornith15-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, ornith15]

    - name: Render pi agent config for Ornith-1.5 (pi-ornith15.json) into pi-configs/
      ansible.builtin.template:
        src: templates/pi-ornith15.json.j2
        dest: "{{ playbook_dir }}/../pi-configs/pi-ornith15.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, ornith15]

    - name: Check llama-server binary present
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_server_stat
      delegate_to: localhost
      tags: [launch]

    - name: Warn if llama-server did not build (scripts will fail)
      ansible.builtin.debug:
        msg: "WARNING [launch] llama-server missing — scripts/ornith15-start.sh will not run until the build succeeds."
      delegate_to: localhost
      when: not llama_server_stat.stat.exists
      tags: [launch]
