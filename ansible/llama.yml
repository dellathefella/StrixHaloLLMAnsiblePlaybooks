- name: "bootstrap — llama.cpp track: latest source build + Gemma4/Qwen3.6/E4B 8-bit models"
  hosts: llama
  gather_facts: yes
  become: yes
  tags: [llama]

  vars:
    llama_repo_url: "https://github.com/ggml-org/llama.cpp.git"
    llama_build_deps:
      - cmake
      - libvulkan-dev     # Vulkan headers + ICD loader (vulkan.h)
      - glslang-tools
      - glslc             # provides glslc (Vulkan shader compiler) for llama.cpp
      - spirv-headers     # SPIRV-HeadersConfig.cmake — required by ggml-vulkan CMake
    gemma_url: "https://huggingface.co/{{ gemma_repo }}/resolve/main/{{ gemma_model }}"
    qwen36_url: "https://huggingface.co/{{ qwen36_repo }}/resolve/main/{{ qwen36_model }}"
    gemma_e4b_url: "https://huggingface.co/{{ gemma_e4b_repo }}/resolve/main/{{ gemma_e4b_model }}"

  tasks:
    - name: Install llama.cpp build dependencies
      ansible.builtin.apt:
        name: "{{ llama_build_deps }}"
        state: present
        update_cache: yes

    - name: Clone latest llama.cpp (HEAD)
      ansible.builtin.git:
        repo: "{{ llama_repo_url }}"
        dest: "{{ llama_repo }}"
        depth: 1
        version: HEAD
        force: yes
      become: no

    - name: Configure build — Vulkan backend (Mesa RADV), release
      ansible.builtin.command:
        cmd: >-
          cmake -B build -DGGML_VULKAN=ON -DGGML_HIP=OFF
          -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          -DCMAKE_INSTALL_PREFIX={{ llama_prefix }}
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Build all targets (parallel)
      ansible.builtin.command:
        cmd: "cmake --build build --config Release -j{{ ansible_processor_vcpus | default(16) }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Install to {{ llama_prefix }} (full install)
      # Full cmake --install needs every target built (it references test
      # binaries like test-tokenizer-0); build above covers all of them.
      ansible.builtin.command:
        cmd: "cmake --install build --prefix {{ llama_prefix }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Verify llama-server binary
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_bin_stat
      tags: [build]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [llama] llama-server missing at {{ llama_bin }} — build failed. Check the cmake/build logs in {{ llama_repo }}/build."
      when: not llama_bin_stat.stat.exists

    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ llama_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    - name: Check if Gemma model already present
      ansible.builtin.stat:
        path: "{{ llama_models_dir }}/{{ gemma_model }}"
      register: gemma_stat
      become: no
      tags: [model, gemma]

    - name: Download Gemma 4 26B-A4B UD-Q8_K_XL ({{ gemma_model }}) [skip if present]
      # aria2c 16-connection (saturates a fast link; single-stream curl / hf
      # download's Xet client both hang/underperform on this system).
      # chdir puts aria2c in the models dir; -o names the file (aria2c would
      # otherwise use the hash ID from the HF URL path as the filename).
      ansible.builtin.command:
        cmd: >-
          aria2c -x 16 -s 16 --file-allocation=none
          --continue=true --allow-overwrite=true
          -o {{ gemma_model }}
          {{ gemma_url }}
      args:
        chdir: "{{ llama_models_dir }}"
      become: no
      changed_when: false
      when: not gemma_stat.stat.exists
      tags: [model, gemma]

    - name: Gemma model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [gemma] {{ gemma_model }} already in {{ llama_models_dir }}"
      when: gemma_stat.stat.exists
      tags: [model, gemma]

    - name: Check if Gemma 4 E4B model already present
      ansible.builtin.stat:
        path: "{{ llama_models_dir }}/{{ gemma_e4b_model }}"
      register: gemma_e4b_stat
      become: no
      tags: [model, gemma-e4b]

    - name: Download Gemma 4 E4B Q4_K_S ({{ gemma_e4b_model }}) [skip if present]
      ansible.builtin.command:
        cmd: >-
          aria2c -x 16 -s 16 --file-allocation=none
          --continue=true --allow-overwrite=true
          -o {{ gemma_e4b_model }}
          {{ gemma_e4b_url }}
      args:
        chdir: "{{ llama_models_dir }}"
      become: no
      changed_when: false
      when: not gemma_e4b_stat.stat.exists
      tags: [model, gemma-e4b]

    - name: Gemma 4 E4B model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [gemma-e4b] {{ gemma_e4b_model }} already in {{ llama_models_dir }}"
      when: gemma_e4b_stat.stat.exists
      tags: [model, gemma-e4b]

    - name: Check if Qwen3.6 model already present
      ansible.builtin.stat:
        path: "{{ llama_models_dir }}/{{ qwen36_model }}"
      register: qwen36_stat
      become: no
      tags: [model, qwen36]

    - name: Download Qwen3.6-35B-A3B UD-Q8_K_XL ({{ qwen36_model }}) [skip if present]
      ansible.builtin.command:
        cmd: >-
          aria2c -x 16 -s 16 --file-allocation=none
          --continue=true --allow-overwrite=true
          -o {{ qwen36_model }}
          {{ qwen36_url }}
      args:
        chdir: "{{ llama_models_dir }}"
      become: no
      changed_when: false
      when: not qwen36_stat.stat.exists
      tags: [model, qwen36]

    - name: Qwen3.6 model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [qwen36] {{ qwen36_model }} already in {{ llama_models_dir }}"
      when: qwen36_stat.stat.exists
      tags: [model, qwen36]

    - name: Check downloaded model files present
      ansible.builtin.find:
        paths: "{{ llama_models_dir }}"
        patterns: "*.gguf"
      register: model_files
      become: no
      tags: [model, gemma, qwen36, gemma-e4b]

    - name: Warn if model downloads are incomplete
      ansible.builtin.debug:
        msg: "WARNING [model] expected 3 GGUF(s) missing in {{ llama_models_dir }} — re-run download."
      when: not (model_files.matched | int >= 3)
      tags: [model, gemma, qwen36, gemma-e4b]

    - name: Print llama.cpp track summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp track complete on {{ inventory_hostname }} ====
          engine: {{ llama_bin }}
          models in {{ llama_models_dir }}:
            gemma4:  {{ gemma_model }}  ({{ gemma_ctx }} ctx, port {{ gemma_port }})
            gemma_e4b: {{ gemma_e4b_model }}  ({{ gemma_e4b_ctx }} ctx, Q4_K_S ~4.8 GB, port {{ gemma_e4b_port }})
            qwen36: {{ qwen36_model }}  ({{ qwen36_ctx }} ctx, port {{ qwen36_port }})
          Launch later via scripts/gemma-start.sh / scripts/gemma-e4b-start.sh / scripts/qwen36-start.sh.
          Vulkan (Mesa RADV) backend — fastest tg + MoE pp on Strix Halo.
      tags: [info]

# -----------------------------------------------------------------------------
# Launch render — drop local gemma/qwen36 launch scripts + pi configs
# -----------------------------------------------------------------------------
- name: "bootstrap — drop local gemma + qwen36 launch scripts & pi configs"
  hosts: llama
  gather_facts: yes
  become: no
  run_once: yes
  tags: [launch, llama]

  tasks:
    - name: Render gemma-start.sh launch script into scripts/
      ansible.builtin.template:
        src: templates/gemma-start.sh.j2
        dest: "{{ playbook_dir }}/../scripts/gemma-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, gemma]

    - name: Render qwen36-start.sh launch script into scripts/
      ansible.builtin.template:
        src: templates/qwen36-start.sh.j2
        dest: "{{ playbook_dir }}/../scripts/qwen36-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, qwen36]

    - name: Render pi agent config for Gemma (pi-gemma.json) into pi-configs/
      ansible.builtin.template:
        src: templates/pi-gemma.json.j2
        dest: "{{ playbook_dir }}/../pi-configs/pi-gemma.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, gemma]

    - name: Render gemma-e4b-start.sh launch script into scripts/
      ansible.builtin.template:
        src: templates/gemma-e4b-start.sh.j2
        dest: "{{ playbook_dir }}/../scripts/gemma-e4b-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, gemma-e4b]

    - name: Render pi agent config for Gemma 4 E4B (pi-gemma-e4b.json) into pi-configs/
      ansible.builtin.template:
        src: templates/pi-gemma-e4b.json.j2
        dest: "{{ playbook_dir }}/../pi-configs/pi-gemma-e4b.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, gemma-e4b]

    - name: Render pi agent config for Qwen3.6 (pi-qwen36.json) into pi-configs/
      ansible.builtin.template:
        src: templates/pi-qwen36.json.j2
        dest: "{{ playbook_dir }}/../pi-configs/pi-qwen36.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, qwen36]

    - name: Check llama-server binary present
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_server_stat
      delegate_to: localhost
      tags: [launch]

    - name: Warn if llama-server did not build (scripts will fail)
      ansible.builtin.debug:
        msg: "WARNING [launch] llama-server missing — scripts/gemma-start.sh, scripts/gemma-e4b-start.sh, and scripts/qwen36-start.sh will not run until the build succeeds."
      delegate_to: localhost
      when: not llama_server_stat.stat.exists
      tags: [launch]
