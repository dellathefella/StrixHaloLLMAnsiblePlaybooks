---
# =============================================================================
# bootstrap.yml — ORCHESTRATOR: imports the per-track playbooks in order.
#
# The tracks live in separate files (see Layout in the README):
#   base.yml     base preflight, packages, toolchain (ROCm 7.2.3), GRUB   [base]
#   ds4.yml      DeepSeek V4 Flash (ds4.c: single-node IQ2_XXS default +   [ds4]
#                multi-node Q4KExperts via ds4-toolbox distrobox)
#   qwen-rccl.yml  Qwen3.5-397B RCCL cluster (vLLM + Ray + RCCL)            [qwen-rccl]
#   llama.yml    Qwen3.6-35B-A3B + Gemma4-E4B via latest llama.cpp          [llama]
#                (source build, Vulkan/RADV, 8-bit UD-Q8_K_XL)
#   summary.yml  final per-host completion summary                        [summary]
#
# Any track file can also be run standalone, e.g.:
#   ansible-playbook -i inventory/hosts ansible/llama.yml
#
# Tags select tracks: --tags llama runs only the llama track (imports are
# static, so skipped plays/tasks cost nothing). --skip-tags base skips the
# base play on an already-provisioned host.
# =============================================================================

- import_playbook: base.yml
- import_playbook: ds4.yml
- import_playbook: qwen-rccl.yml
- import_playbook: llama.yml
- import_playbook: laguna.yml
- import_playbook: summary.yml
