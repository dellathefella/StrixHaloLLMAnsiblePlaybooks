---
# =============================================================================
# bootstrap.yml — ROOT ORCHESTRATOR (imports subdirectory bootstraps)
#
# This root bootstrap is a convenience wrapper that imports the single-node
# and multi-node bootstraps. For most use cases, run the appropriate
# subdirectory bootstrap directly:
#
# Single-node (recommended for this host):
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/single-node/bootstrap.yml
#
# Multi-node (cluster):
#   ansible-playbook -i ansible/multi-node/inventory/hosts ansible/multi-node/bootstrap.yml
#
# =============================================================================

- import_playbook: single-node/bootstrap.yml
- import_playbook: multi-node/bootstrap.yml
