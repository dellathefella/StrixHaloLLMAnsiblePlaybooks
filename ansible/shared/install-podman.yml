---
# =============================================================================
# install-podman.yml
# Cross-distro podman installation for Fedora, Debian/Ubuntu, and Arch Linux
#
# Shared playbook: works with either track's inventory (single-node or multi-node).
# Usage:
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/shared/install-podman.yml
#   ansible-playbook -i ansible/multi-node/inventory/hosts ansible/shared/install-podman.yml
# =============================================================================

- name: "install-podman — detect OS and install podman"
  hosts: all
  gather_facts: yes
  become: yes
  tags: [podman]

  tasks:
    - name: Print specific OS and IP facts
      ansible.builtin.debug:
        msg: >
          The OS family is '{{ ansible_facts['os_family'] }}' (lower: '{{ ansible_facts['os_family'] | lower }}')
          and the main IP is {{ ansible_facts['default_ipv4']['address'] }}

    # -----------------------------------------------------------------------
    # 1. Fedora (dnf)
    # -----------------------------------------------------------------------
    - name: Install podman on Fedora
      ansible.builtin.dnf:
        name: podman
        state: present
      when:
        - ansible_os_family  | lower == "fedora"
      tags: [podman, fedora]

    # -----------------------------------------------------------------------
    # 2. Debian/Ubuntu (apt)
    # -----------------------------------------------------------------------
    - name: Install podman on Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - podman
        state: present
        update_cache: yes
      when:
        - (ansible_facts['os_family']   | lower == "debian") or
          (ansible_facts['os_family']   | lower == "ubuntu")
      tags: [podman, debian, ubuntu]

    # -----------------------------------------------------------------------
    # 3. Arch Linux (community.general.pacman)
    # -----------------------------------------------------------------------
    - name: Install podman on Arch Linux
      community.general.pacman:
        name:
          - podman
          - podman-compose
        state: present
      when:
        - ansible_os_family | lower == "archlinux"
      tags: [podman, arch]

    # -----------------------------------------------------------------------
    # 4. Verify installation
    # -----------------------------------------------------------------------
    - name: Verify podman is installed
      ansible.builtin.command:
        cmd: podman --version
      register: podman_version
      changed_when: false
      failed_when: false
      tags: [podman]

    - name: Print podman version
      ansible.builtin.debug:
        msg: "podman installed: {{ podman_version.stdout | default('NOT INSTALLED') }}"
      tags: [podman]