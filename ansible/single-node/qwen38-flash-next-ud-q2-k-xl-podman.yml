---
# =============================================================================
# qwen38-flash-next-ud-q2-k-xl-podman.yml
# Qwen3.8-Flash-Next (UD-Q2_K_XL quantization, ~89 GB) — llama.cpp via Podman,
# using Nathanw1014's Strix Halo tuned image (Vulkan backend, gfx1151
# Flash-Attention + MoE-prefill fixes). A single launch script is rendered:
#   ~/scripts/qwen38-flash-next-ud-q2-k-xl-start.sh
#
# qwen4exp (Qwen3.8-Flash-Next) needs a llama.cpp build at or after PR #27742
# (merged 2026-08-27); b10680 carries it. Keep the KV cache on f16.
# =============================================================================

- name: "podman — setup + deploy llama.cpp container (UD-Q2_K_XL)"
  hosts: vulkan
  gather_facts: yes
  become: yes
  tags: [qwen38-flash-next-ud-q2-k-xl-podman]

  vars:
    # =====================================================================
    # Qwen3.8-Flash-Next (UD-Q2_K_XL) track vars — self-contained, no group_vars
    # =====================================================================

    # Container settings — uses Nathanw1014's pre-built Strix Halo tuned image
    # (Vulkan backend, gfx1151 Flash-Attention + MoE-prefill fixes).
    #   track_stem       → stem used for container name, script names
    track_stem: "qwen38-flash-next-ud-q2-k-xl"
    image_repo: "ghcr.io/nathanw1014/strix-halo-llamacpp"
    image_tag: "vulkan"
    docker_image: "{{ image_repo }}:{{ image_tag }}"
    docker_container_name: "{{ track_stem }}"

    # Model settings
    ctx: 262144
    port: 8080
    batch: 256
    ubatch: 512
    # HF file paths (3 shards)
    model_shard_1: "UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00001-of-00003.gguf"
    model_shard_2: "UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00002-of-00003.gguf"
    model_shard_3: "UD-Q2_K_XL/Qwen3.8-Flash-Next-UD-Q2_K_XL-00003-of-00003.gguf"
    local_model_dir: "Qwen3.8-Flash-Next-UD-Q2_K_XL"
    hf_repo: "unsloth/Qwen3.8-Flash-Next-GGUF"
    n_gpu: 999

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('8192') }}"
    # Shard directory + the part-1 file llama.cpp is pointed at (it picks up
    # parts 2+3 from the same directory), shared with the launch script template.
    _model_dir_path: "{{ _models_dir }}/{{ local_model_dir }}"
    _model_path: "{{ _model_dir_path }}/{{ model_shard_1 | basename }}"

    # Model download settings — read token on controller
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

  tasks:
    # -----------------------------------------------------------------------
    # 1. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Ensure models directory exists
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        mode: "0755"
      tags: [podman, model]

    - name: Ensure proper ownership of models directory
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        owner: "{{ ansible_env.USER | default('root') }}"
        group: "{{ ansible_env.USER | default('root') }}"
        mode: "0755"
      become: yes
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 1a. Rename UD-Q2_K_XL -> Qwen3.8-Flash-Next-UD-Q2_K_XL (pre-download)
    # -----------------------------------------------------------------------
    - name: Stat UD-Q2_K_XL folder
      ansible.builtin.stat:
        path: "{{ _models_dir }}/UD-Q2_K_XL"
      register: _pre_rename_stat
      failed_when: false
      tags: [podman, model]

    - name: Rename UD-Q2_K_XL folder to Qwen3.8-Flash-Next-UD-Q2_K_XL
      ansible.builtin.command:
        cmd: "mv {{ _models_dir }}/UD-Q2_K_XL {{ _models_dir }}/Qwen3.8-Flash-Next-UD-Q2_K_XL"
      when:
        - _pre_rename_stat.stat is defined
        - _pre_rename_stat.stat.exists
      tags: [podman, model]

    - name: Stat Qwen3.8-Flash-Next-UD-Q2_K_XL folder
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ local_model_dir }}"
      register: _post_rename_stat
      failed_when: false
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2. Download model if not present
    # -----------------------------------------------------------------------
    - name: Check if model shard 1 already exists
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ local_model_dir }}/{{ model_shard_1 | basename }}"
      register: model_file_stat
      tags: [podman, model]

    - name: Print model download status
      ansible.builtin.debug:
        msg: "Checking for model at: {{ _models_dir }}/{{ local_model_dir }}/{{ model_shard_1 | basename }} | Found: {{ model_file_stat.stat.exists | default('unknown') }}"
      tags: [podman, model]


    - name: Download model shards from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ item }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      loop:
        - "{{ model_shard_1 }}"
        - "{{ model_shard_2 }}"
        - "{{ model_shard_3 }}"
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length > 0
      register: hf_download_result
      loop_control:
        label: "{{ item }}"
      tags: [podman, model]

    - name: Download model shards without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ item }} --local-dir {{ _models_dir }}
      loop:
        - "{{ model_shard_1 }}"
        - "{{ model_shard_2 }}"
        - "{{ model_shard_3 }}"
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length == 0
      register: hf_download_result
      loop_control:
        label: "{{ item }}"
      tags: [podman, model]

    - name: Print model download result
      ansible.builtin.debug:
        msg: "Download result: {{ hf_download_result }}"
      when: hf_download_result is defined
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # Rename downloaded folder from HF name to local name
    # -----------------------------------------------------------------------
    - name: Stat HF downloaded folder
      ansible.builtin.stat:
        path: "{{ _models_dir }}/UD-Q2_K_XL"
      register: _hf_folder_stat
      failed_when: false
      tags: [podman, model]

    - name: Rename downloaded model folder to local name
      ansible.builtin.command:
        cmd: "mv {{ _models_dir }}/UD-Q2_K_XL {{ _models_dir }}/{{ local_model_dir }}"
      when:
        - _hf_folder_stat.stat is defined
        - _hf_folder_stat.stat.exists
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 3. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Remove any existing container with the same name
      ansible.builtin.command:
        cmd: "podman rm -f {{ docker_container_name }}"
      ignore_errors: yes
      changed_when: false
      tags: [podman, deploy]

    - name: Run llama.cpp container (Podman, single Vulkan)
      ansible.builtin.command:
        cmd: >-
          podman run -d --name {{ docker_container_name }}
          --rm --pull=newer
          --device=/dev/dri/renderD128
          --device=/dev/kfd
          --privileged
          --entrypoint llama-server
          -v {{ _models_dir }}:{{ _models_dir }}:ro
          -p {{ port }}:{{ port }}
          {{ docker_image }}
          --model {{ _model_path }}
          --host 0.0.0.0
          --port {{ port }}
          --ctx-size {{ _docker_ctx_len }}
          --n-gpu-layers {{ n_gpu | d(999) }}
          --batch-size {{ batch | d(256) }}
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Print container start result
      ansible.builtin.debug:
        msg: "Container started: {{ podman_run_result.stdout | default('unknown') }}"
      when: podman_run_result is defined
      tags: [podman, deploy]

    - name: Check if container is running
      ansible.builtin.command:
        cmd: "podman ps --filter name={{ docker_container_name }} --format json"
      register: container_check
      changed_when: false
      failed_when: false
      tags: [podman, deploy]

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).
          
          To debug, run manually:
            podman run -it --rm --device=/dev/dri/renderD128 --device=/dev/kfd --privileged --entrypoint llama-server -v {{ _models_dir }}:{{ _models_dir }}:ro -p {{ port }}:{{ port }} {{ docker_image }} --model {{ _model_path }} --host 0.0.0.0 --port {{ port }} --ctx-size {{ _docker_ctx_len }} --n-gpu-layers {{ n_gpu | d(999) }} --batch-size {{ batch | d(256) }}
          
          Check GPU access: ls -la /dev/dri/ /dev/kfd
      tags: [podman, deploy]

    - name: Sleep 10s to let container initialize
      ansible.builtin.command:
        cmd: "sleep 10"
      changed_when: false
      tags: [podman, deploy]

    - name: Wait for llama-server API to respond
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/health"
        return_content: yes
        status_code: 200
      register: health_check
      retries: 60
      delay: 5
      until: health_check is succeeded
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 5. Write launch script to remote host
    # -----------------------------------------------------------------------
    - name: Ensure scripts directory exists on host
      ansible.builtin.file:
        path: "{{ _user_home }}/scripts"
        state: directory
        mode: "0755"
      tags: [podman, launch]

    - name: Render launch script ({{ track_stem }}-start.sh) into ~/scripts/
      ansible.builtin.template:
        src: "templates/scripts/{{ track_stem }}-start.sh.j2"
        dest: "{{ _user_home }}/scripts/{{ track_stem }}-start.sh"
        mode: "0755"
      tags: [podman, launch]

    - name: Ensure pi-configs output directory exists on controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/rendered/pi-configs"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Render pi agent config for Qwen3.8-Flash-Next (pi-qwen38-flash-next-ud-q2-k-xl-podman.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-configs/pi-qwen38-flash-next-ud-q2-k-xl-podman.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-qwen38-flash-next-ud-q2-k-xl-podman.json"
        mode: "0644"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }}
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _model_path }} (shard 1 of 3)
          GPU layers: {{ n_gpu | d(999) }}
          Context: {{ _docker_ctx_len }}
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
