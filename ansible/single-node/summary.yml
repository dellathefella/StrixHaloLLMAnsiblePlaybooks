---
- name: "Bootstrap — final summary"
  hosts: aiservers
  gather_facts: false # local/controller runs skip facts; uses inventory_hostname/groups
  become: true
  tags: [summary]
  tasks:
    - name: Print completion summary
      ansible.builtin.debug:
        msg: |
          ==== bootstrap complete on {{ inventory_hostname }} ====
          backends: {{ ['vulkan' if 'vulkan' in groups and inventory_hostname in groups['vulkan'] else '',
                        'rocm' if 'rocm' in groups and inventory_hostname in groups['rocm'] else ''] | select('string') | join(', ') }}
          Fix any [kernel|firmware|grub|memory|device|reboot|link|build|model|container]
          warnings above before serving. Launch scripts + opencode configs are dropped
          locally in scripts/ and opencode-configs/. REBOOT if GRUB args were appended.
