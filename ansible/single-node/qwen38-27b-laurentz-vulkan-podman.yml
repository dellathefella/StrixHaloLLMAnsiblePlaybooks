---
# =============================================================================
# qwen38-27b-laurentz-vulkan-podman.yml
# Qwen3.8-27B (ROCmFP4-FAST) — llama.cpp via Podman, using LaurentZuijdwijk's
# fork (https://github.com/LaurentZuijdwijk/llama.cpp), which adds adaptive
# speculative decoding ("DFlash2") tuned for AMD Strix Halo/gfx1151:
#   "Qwen3.8-27B (FP4)" — 65.6 t/s structured output, 4.7x bare decode
#     (per the fork's own README benchmark; not independently verified here)
#
# BUILT FROM SOURCE, not pulled: the fork publishes no runnable container
# image (its only GHCR package, ghcr.io/laurentzuijdwijk/llama.cpp, is just
# `buildcache-*` CI layer caches for CUDA/ROCm — not bootable, and no Vulkan
# tag at all despite Vulkan being the point of this fork on this hardware).
# See containerfiles/qwen38-27b-laurentz-vulkan.Containerfile — pinned to
# commit 5e085d123eead2e89b5c19f824fccb05727da6a2 (2026-08-31, master).
#
# UNVERIFIED FLAG: the fork's README only documents the DFlash2 draft model
# via the auto-download `-hfd <hf-repo>` shorthand — never a local-file flag.
# This track assumes --model-draft (upstream's flag for --spec-type
# draft-mtp, already proven in the qwen38-27b-ud-q4-k-xl track) also works
# for --spec-type draft-dflash. If the coordinator ignores the drafter, run
# `podman exec <container> /app/llama-server --help` on the host to find the
# real flag name and fix _podman_common_args below.
#
#   image           localhost/qwen38-27b-laurentz-vulkan:5e085d123eea (built here)
#   model           Qwen3.8-27B-ROCmFP4-FAST.gguf (julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF)
#   drafter         Qwen3.8-27B-DFlash2-Q4_0_ROCMFP4_FAST.gguf
#                   (agentionai/Qwen3.8-27B-DFlash2-ROCmFP4-FAST-GGUF)
#   launch script   ~/scripts/qwen38-27b-laurentz-vulkan-start.sh
# =============================================================================

- name: "podman — build from source + deploy llama.cpp container (LaurentZuijdwijk fork, DFlash2)"
  hosts: vulkan
  gather_facts: yes
  become: yes
  tags: [qwen38-27b-laurentz-vulkan-podman]

  vars:
    # =====================================================================
    # Qwen3.8-27B LaurentZuijdwijk/DFlash2 track vars — self-contained, no group_vars
    # =====================================================================
    track_stem: "qwen38-27b-laurentz-vulkan"

    # Source pin — see the Containerfile header for why this must be built,
    # not pulled. Bump this (and re-run) to pick up newer fork commits; the
    # image tag embeds it, so a bump always triggers a real rebuild.
    llama_cpp_commit: "5e085d123eead2e89b5c19f824fccb05727da6a2"
    docker_image: "localhost/{{ track_stem }}:{{ llama_cpp_commit[:12] }}"
    docker_container_name: "{{ track_stem }}"

    # Model settings — per the fork's own "65.6 t/s" benchmark config.
    ctx: 65536
    port: 8080
    n_gpu: 999
    spec_draft_ngl: 99          # GPU layers for the DFlash2 draft model specifically
    batch: 2048
    ubatch: 512
    flash_attn: "on"
    model: "Qwen3.8-27B-ROCmFP4-FAST.gguf"
    hf_repo: "julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF"

    # DFlash2 draft/support model — separate GGUF, loaded via --model-draft
    # (see the UNVERIFIED FLAG note above).
    mtp_draft_file: "Qwen3.8-27B-DFlash2-Q4_0_ROCMFP4_FAST.gguf"
    mtp_repo: "agentionai/Qwen3.8-27B-DFlash2-ROCmFP4-FAST-GGUF"

    spec_type: "draft-dflash"
    spec_draft_n_min: 3
    spec_draft_n_max: 7

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('32768') }}"

    # Model download settings — read token on controller
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

    hf_download_items:
      - { repo: "{{ hf_repo }}", file: "{{ model }}", dest_dir: "{{ _models_dir }}" }
      - { repo: "{{ mtp_repo }}", file: "{{ mtp_draft_file }}", dest_dir: "{{ _models_dir }}" }

    _containerfile_path: "containerfiles/{{ track_stem }}.Containerfile"
    _build_arg: "LLAMA_CPP_COMMIT={{ llama_cpp_commit }}"

    # Everything after the run-mode flags (-d --name X / -it), shared between
    # the real launch and the manual debug hint below — keeps them from drifting.
    # NOTE the --entrypoint path: our own Containerfile puts the binary at
    # /app/llama-server with no PATH entry, unlike the Nathanw1014-based
    # tracks (bare `llama-server`) — this is a different image, not a typo.
    _podman_common_args: >-
      --device=/dev/dri/renderD128
      --device=/dev/kfd
      --privileged
      --entrypoint /app/llama-server
      --pull=never
      -v {{ _models_dir }}:{{ _models_dir }}:ro
      -p {{ port }}:{{ port }}
      {{ docker_image }}
      --model {{ _models_dir }}/{{ model }}
      --model-draft {{ _models_dir }}/{{ mtp_draft_file }}
      --host 0.0.0.0
      --port {{ port }}
      --ctx-size {{ _docker_ctx_len }}
      --n-gpu-layers {{ n_gpu | d(999) }}
      --spec-draft-ngl {{ spec_draft_ngl | d(99) }}
      --batch-size {{ batch | d(2048) }}
      --ubatch-size {{ ubatch | d(512) }}
      --flash-attn {{ flash_attn | d('on') }}
      --spec-type {{ spec_type }}
      --spec-draft-adaptive
      --spec-draft-n-min {{ spec_draft_n_min | d(3) }}
      --spec-draft-n-max {{ spec_draft_n_max | d(7) }}

  tasks:
    # -----------------------------------------------------------------------
    # 1. Build the image from source (skipped if the pinned tag already exists)
    # -----------------------------------------------------------------------
    - name: Build LaurentZuijdwijk/llama.cpp image from source
      ansible.builtin.include_tasks: tasks/podman-build-image.yml

    # -----------------------------------------------------------------------
    # 2. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Set up models directory
      ansible.builtin.include_tasks: tasks/podman-models-dir.yml

    # -----------------------------------------------------------------------
    # 3. Download model + DFlash2 drafter if not present
    # -----------------------------------------------------------------------
    - name: Download model + DFlash2 drafter
      ansible.builtin.include_tasks: tasks/hf-download-files.yml

    # -----------------------------------------------------------------------
    # 4. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Remove any existing container
      ansible.builtin.include_tasks: tasks/podman-remove-container.yml

    - name: Run llama.cpp container (Podman, LaurentZuijdwijk fork, DFlash2)
      ansible.builtin.command:
        cmd: "podman run -d --name {{ docker_container_name }} --rm {{ _podman_common_args }}"
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Check container status
      ansible.builtin.include_tasks: tasks/podman-check-running.yml

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          To debug, run manually:
            podman run -it --rm {{ _podman_common_args }}

          If it starts but ignores the drafter, --model-draft may be the wrong
          flag for --spec-type draft-dflash on this fork (unverified — see the
          header comment). Check:
            podman run -it --rm --entrypoint /app/llama-server {{ docker_image }} --help

          Check GPU access: ls -la /dev/dri/ /dev/kfd
      when: container_check.stdout | default('') | length == 0
      tags: [podman, deploy]

    - name: Wait for the server to come up
      ansible.builtin.include_tasks: tasks/podman-wait-health.yml

    # -----------------------------------------------------------------------
    # 5. Write launch script + pi config
    # -----------------------------------------------------------------------
    - name: Render launch script + pi config
      ansible.builtin.include_tasks: tasks/podman-render-launch-artifacts.yml

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman, LaurentZuijdwijk fork) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }} (built from source, commit {{ llama_cpp_commit }})
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _models_dir }}/{{ model }}
          Drafter: {{ _models_dir }}/{{ mtp_draft_file }} ({{ spec_type }}, adaptive n {{ spec_draft_n_min | d(3) }}-{{ spec_draft_n_max | d(7) }})
          GPU layers: {{ n_gpu | d(999) }} (main) / {{ spec_draft_ngl | d(99) }} (draft)
          Batch {{ batch | d(2048) }} / ubatch {{ ubatch | d(512) }} | Flash-attn {{ flash_attn | d('on') }}
          Context: {{ _docker_ctx_len }}
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
