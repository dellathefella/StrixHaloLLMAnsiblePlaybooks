---
# =============================================================================
# qwen38-27b-ud-q4-k-xl-podman.yml
# Qwen3.8-27B (UD-Q4_K_XL quantization) — llama.cpp via Podman, using
# Nathanw1014's Strix Halo tuned image (Vulkan backend, gfx1151 Flash-Attention
# + MoE-prefill fixes). A single launch script is rendered:
#   ~/scripts/qwen38-27b-ud-q4-k-xl-start.sh
#
# Speculation profile: MTP drafter (unsloth MTP/mtp-Qwen3.8-27B-Q4_0.gguf)
#   --spec-type draft-mtp --spec-draft-n-max 3 --model-draft <MTP drafter>
#   KV cache: f16 (K+V), batch 2048 / ubatch 512, flash-attn on, mmap loading,
#   1 server slot, all layers on the GPU.
#
# MTP landed in llama.cpp on 2026-06-07 (PR #23398); the container tag above is
# newer, so the drafter loads. draft-mtp needs a drafter file — it is only
# auto-discovered with -hf, so with a local --model we pass --model-draft.
# =============================================================================

- name: "podman — setup + deploy llama.cpp container (UD-Q4_K_XL)"
  hosts: vulkan
  gather_facts: yes
  become: yes
  tags: [qwen38-27b-ud-q4-k-xl-podman]

  vars:
    # =====================================================================
    # Qwen3.8-27B (UD-Q4_K_XL quantization) track vars — self-contained, no group_vars
    # =====================================================================

    # Container settings — uses Nathanw1014's pre-built Strix Halo tuned image
    # (Vulkan backend, gfx1151 Flash-Attention + MoE-prefill fixes).
    #   track_stem       → stem used for container name, script names
    track_stem: "qwen38-27b-ud-q4-k-xl"
    image_repo: "ghcr.io/nathanw1014/strix-halo-llamacpp"
    image_tag: "vulkan"
    docker_image: "{{ image_repo }}:{{ image_tag }}"
    docker_container_name: "{{ track_stem }}"

    # Model settings
    ctx: 131072
    port: 8080
    parallel: 1
    batch: 2048
    ubatch: 512
    model: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
    hf_repo: "unsloth/Qwen3.8-27B-GGUF"
    n_gpu: 999
    flash_attn: "on"
    load_mode: "mmap"

    # MTP speculation: drafter lives in the repo's MTP/ subdir and lands in
    # <models>/MTP/..., which keeps it out of the way of other tracks.
    spec_type: "draft-mtp"
    spec_draft_n_max: 3
    mtp_draft_file: "MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
    cache_type_k: "f16"
    cache_type_v: "f16"

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('8192') }}"

    # Model download settings — read token on controller
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

    hf_download_items:
      - { repo: "{{ hf_repo }}", file: "{{ model }}", dest_dir: "{{ _models_dir }}" }
      - { repo: "{{ hf_repo }}", file: "{{ mtp_draft_file }}", dest_dir: "{{ _models_dir }}" }

    # Everything after the run-mode flags (-d --name X / -it), shared between
    # the real launch and the manual debug hint below — keeps them from drifting.
    _podman_common_args: >-
      --device=/dev/dri/renderD128
      --device=/dev/kfd
      --privileged
      --entrypoint llama-server
      -v {{ _models_dir }}:{{ _models_dir }}:ro
      -p {{ port }}:{{ port }}
      {{ docker_image }}
      --model {{ _models_dir }}/{{ model }}
      --model-draft {{ _models_dir }}/{{ mtp_draft_file }}
      --host 0.0.0.0
      --port {{ port }}
      --ctx-size {{ _docker_ctx_len }}
      --parallel {{ parallel | d(1) }}
      --n-gpu-layers {{ n_gpu | d(999) }}
      --batch-size {{ batch | d(2048) }}
      --ubatch-size {{ ubatch | d(512) }}
      --cache-type-k {{ cache_type_k }}
      --cache-type-v {{ cache_type_v }}
      --flash-attn {{ flash_attn | d('on') }}
      --load-mode {{ load_mode | d('mmap') }}
      --spec-type {{ spec_type }}
      --spec-draft-n-max {{ spec_draft_n_max | d(3) }}

  tasks:
    # -----------------------------------------------------------------------
    # 1. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Set up models directory
      ansible.builtin.include_tasks: tasks/podman-models-dir.yml

    # -----------------------------------------------------------------------
    # 2. Download model + MTP drafter if not present
    # -----------------------------------------------------------------------
    - name: Download model + MTP drafter
      ansible.builtin.include_tasks: tasks/hf-download-files.yml

    # -----------------------------------------------------------------------
    # 3. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Remove any existing container
      ansible.builtin.include_tasks: tasks/podman-remove-container.yml

    - name: Run llama.cpp container (Podman, single Vulkan)
      ansible.builtin.command:
        cmd: "podman run -d --name {{ docker_container_name }} --rm --pull=newer {{ _podman_common_args }}"
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Check container status
      ansible.builtin.include_tasks: tasks/podman-check-running.yml

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          To debug, run manually:
            podman run -it --rm {{ _podman_common_args }}

          Check GPU access: ls -la /dev/dri/ /dev/kfd
      tags: [podman, deploy]

    - name: Wait for the server to come up
      ansible.builtin.include_tasks: tasks/podman-wait-health.yml

    # -----------------------------------------------------------------------
    # 4. Write launch script + pi config
    # -----------------------------------------------------------------------
    - name: Render launch script + pi config
      ansible.builtin.include_tasks: tasks/podman-render-launch-artifacts.yml

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }}
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _models_dir }}/{{ model }}
          Drafter: {{ _models_dir }}/{{ mtp_draft_file }} ({{ spec_type }}, n-max {{ spec_draft_n_max | d(3) }})
          KV cache: {{ cache_type_k }} (K) / {{ cache_type_v }} (V) | Batch {{ batch | d(2048) }} / ubatch {{ ubatch | d(512) }} | FA {{ flash_attn | d('on') }} | load {{ load_mode | d('mmap') }}
          GPU layers: {{ n_gpu | d(999) }}
          Context: {{ _docker_ctx_len }}
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
