---
# =============================================================================
# qwen38-27b-ud-q4-k-xl-podman.yml
# Qwen3.8-27B (UD-Q4_K_XL quantization) — llama.cpp via Podman, deployable on
# either GPU backend (llm_backend=vulkan|rocm, image tag server-<backend>-b10680).
# A launch script is rendered per backend:
#   ~/scripts/qwen38-27b-ud-q4-k-xl-vulkan-start.sh
#   ~/scripts/qwen38-27b-ud-q4-k-xl-rocm-start.sh
#
# Speculation profile: MTP drafter (unsloth MTP/mtp-Qwen3.8-27B-Q4_0.gguf)
#   --spec-type draft-mtp --spec-draft-n-max 3 --model-draft <MTP drafter>
#   KV cache: f16 (K+V), batch 2048 / ubatch 512, flash-attn on, mmap loading,
#   1 server slot, all layers on the GPU.
#
# MTP landed in llama.cpp on 2026-06-07 (PR #23398); the container tag above is
# newer, so the drafter loads. draft-mtp needs a drafter file — it is only
# auto-discovered with -hf, so with a local --model we pass --model-draft.
# =============================================================================

- name: "podman — setup + deploy llama.cpp container (UD-Q4_K_XL, {{ llm_backend }})"
  hosts: qwen38-27b-ud-q4-k-xl
  gather_facts: yes
  become: yes
  tags: [qwen38-27b-ud-q4-k-xl-podman]

  vars:
    # =====================================================================
    # Qwen3.8-27B (UD-Q4_K_XL quantization) track vars — self-contained, no group_vars
    # =====================================================================

    # Container settings — backend is selectable (see the header).
    #   llm_backend      → image + container name this play deploys
    #   launch_backends  → one launch script rendered per entry (both by default)
    llm_backend: "vulkan"
    launch_backends: [vulkan, rocm]
    track_stem: "qwen38-27b-ud-q4-k-xl"
    image_repo: "ghcr.io/ggml-org/llama.cpp"
    image_tag: "b10680"
    docker_image: "{{ image_repo }}:server-{{ llm_backend }}-{{ image_tag }}"
    docker_container_name: "{{ track_stem }}-{{ llm_backend }}"

    # Model settings
    ctx: 262144
    port: 8080
    parallel: 1
    batch: 2048
    ubatch: 512
    model: "Qwen3.8-27B-UD-Q4_K_XL.gguf"
    hf_repo: "unsloth/Qwen3.8-27B-GGUF"
    n_gpu: 999
    flash_attn: "on"
    load_mode: "mmap"

    # MTP speculation: drafter lives in the repo's MTP/ subdir and lands in
    # <models>/MTP/..., which keeps it out of the way of other tracks.
    spec_type: "draft-mtp"
    spec_draft_n_max: 3
    mtp_draft_file: "MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
    cache_type_k: "f16"
    cache_type_v: "f16"

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('8192') }}"

    # Model download settings — read token on controller
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

  tasks:
    # -----------------------------------------------------------------------
    # 0. Backend guard — fail fast on a bad -e llm_backend=...
    # -----------------------------------------------------------------------
    - name: Validate the requested backend
      ansible.builtin.assert:
        that:
          - llm_backend in launch_backends
        fail_msg: "llm_backend='{{ llm_backend }}' is not one of {{ launch_backends }}"
        quiet: yes
      run_once: yes
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 1. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Ensure models directory exists
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        mode: "0755"
      tags: [podman, model]

    - name: Ensure proper ownership of models directory
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        owner: "{{ ansible_env.USER | default('root') }}"
        group: "{{ ansible_env.USER | default('root') }}"
        mode: "0755"
      become: yes
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2. Download model if not present
    # -----------------------------------------------------------------------
    - name: Check if model file already exists
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ model }}"
      register: model_file_stat
      tags: [podman, model]

    - name: Print model download status
      ansible.builtin.debug:
        msg: "Checking for model at: {{ _models_dir }}/{{ model }} | Found: {{ model_file_stat.stat.exists | default('unknown') }} | stat: {{ model_file_stat.stat }}"
      tags: [podman, model]


    - name: Download model from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ model }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length > 0
      register: hf_download_result
      changed_when: "'Downloaded' in hf_download_result.stdout or 'Updated' in hf_download_result.stdout"
      tags: [podman, model]

    - name: Download model without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ model }} --local-dir {{ _models_dir }}
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length == 0
      register: hf_download_result
      changed_when: "'Downloaded' in hf_download_result.stdout or 'Updated' in hf_download_result.stdout"
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2b. Fetch the MTP drafter — draft-mtp requires it; llama.cpp only
    # auto-discovers a sibling drafter when loading with -hf, not from a
    # local --model, so we pass it explicitly via --model-draft.
    # -----------------------------------------------------------------------
    - name: Check if MTP drafter already exists
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ mtp_draft_file }}"
      register: mtp_draft_stat
      tags: [podman, model]

    - name: Download MTP drafter from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ mtp_draft_file }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      when:
        - not mtp_draft_stat.stat.exists
        - hf_token_lookup | length > 0
      register: mtp_download_result
      changed_when: "'Downloaded' in mtp_download_result.stdout or 'Updated' in mtp_download_result.stdout"
      tags: [podman, model]

    - name: Download MTP drafter without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ mtp_draft_file }} --local-dir {{ _models_dir }}
      when:
        - not mtp_draft_stat.stat.exists
        - hf_token_lookup | length == 0
      register: mtp_download_result
      changed_when: "'Downloaded' in mtp_download_result.stdout or 'Updated' in mtp_download_result.stdout"
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 3. Check podman and deploy container
    # -----------------------------------------------------------------------
    - name: Check if podman is available
      ansible.builtin.command:
        cmd: which podman
      register: podman_binary
      changed_when: false
      failed_when: false
      tags: [podman, deploy]

    - name: Stop existing container if running
      ansible.builtin.command:
        cmd: "podman stop {{ docker_container_name }}"
      ignore_errors: yes
      changed_when: false
      when: podman_binary.rc == 0
      tags: [podman, deploy]

    - name: Remove existing container
      ansible.builtin.command:
        cmd: "podman rm -f {{ docker_container_name }}"
      ignore_errors: yes
      changed_when: false
      when: podman_binary.rc == 0
      tags: [podman, deploy]

    - name: Kill anything using the target port
      ansible.builtin.shell: |
        fuser -k {{ port }}/tcp 2>/dev/null || true
      register: port_kill_result
      changed_when: "'no process' not in port_kill_result.stderr"
      failed_when: false
      tags: [podman, deploy]

    - name: Run llama.cpp {{ llm_backend }} container
      ansible.builtin.command:
        cmd: >-
          podman run -d --name {{ docker_container_name }}
          --rm --pull=newer
          --device=/dev/dri/renderD128
          --device=/dev/kfd
          --privileged
          -v {{ _models_dir }}:{{ _models_dir }}:ro
          -p {{ port }}:{{ port }}
          {{ docker_image }}
          --model {{ _models_dir }}/{{ model }}
          --model-draft {{ _models_dir }}/{{ mtp_draft_file }}
          --host 0.0.0.0
          --port {{ port }}
          --ctx-size {{ _docker_ctx_len }}
          --parallel {{ parallel | d(1) }}
          --n-gpu-layers {{ n_gpu | d(999) }}
          --batch-size {{ batch | d(2048) }}
          --ubatch-size {{ ubatch | d(512) }}
          --cache-type-k {{ cache_type_k }}
          --cache-type-v {{ cache_type_v }}
          --flash-attn {{ flash_attn | d('on') }}
          --load-mode {{ load_mode | d('mmap') }}
          --spec-type {{ spec_type }}
          --spec-draft-n-max {{ spec_draft_n_max | d(3) }}
      when: podman_binary.rc == 0
      register: container_run_result
      changed_when: "'already exists' not in container_run_result.stdout | lower"
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 4. Verify
    # -----------------------------------------------------------------------
    - name: Check container status after start
      ansible.builtin.command:
        cmd: "podman ps -a --filter name={{ docker_container_name }} --format \"{{ '{{' }}.Names{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}\""
      register: container_status
      changed_when: false
      ignore_errors: yes
      tags: [podman, deploy]

    - name: Show container logs if failed
      ansible.builtin.command:
        cmd: "podman logs {{ docker_container_name }} --tail 50"
      register: container_failure_logs
      changed_when: false
      ignore_errors: yes
      tags: [podman, deploy]

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).
          
          To debug, run manually:
            podman run -it --rm --device=/dev/dri/renderD128 --device=/dev/kfd --privileged -v {{ _models_dir }}:{{ _models_dir }}:ro -p {{ port }}:{{ port }} {{ docker_image }} --model {{ _models_dir }}/{{ model }} --model-draft {{ _models_dir }}/{{ mtp_draft_file }} --host 0.0.0.0 --port {{ port }} --ctx-size {{ _docker_ctx_len }} --parallel {{ parallel | d(1) }} --n-gpu-layers {{ n_gpu | d(999) }} --batch-size {{ batch | d(2048) }} --ubatch-size {{ ubatch | d(512) }} --cache-type-k {{ cache_type_k }} --cache-type-v {{ cache_type_v }} --flash-attn {{ flash_attn | d('on') }} --load-mode {{ load_mode | d('mmap') }} --spec-type {{ spec_type }} --spec-draft-n-max {{ spec_draft_n_max | d(3) }}
          
          Check GPU access: ls -la /dev/dri/ /dev/kfd
          Check {{ llm_backend }}: {{ 'vulkaninfo --summary' if llm_backend == 'vulkan' else 'rocminfo --summary' }}
      tags: [podman, deploy]

    - name: Sleep 10s to let container initialize
      ansible.builtin.command:
        cmd: "sleep 10"
      changed_when: false
      tags: [podman, deploy]

    - name: Wait for llama-server API to respond
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/health"
        return_content: yes
        status_code: 200
      register: health_check
      retries: 60
      delay: 5
      until: health_check is succeeded
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 5. Write launch script to remote host
    # -----------------------------------------------------------------------
    - name: Ensure scripts directory exists on host
      ansible.builtin.file:
        path: "{{ _user_home }}/scripts"
        state: directory
        mode: "0755"
      tags: [podman, launch]

    - name: Render one launch script per backend ({{ track_stem }}-<backend>-start.sh) into ~/scripts/
      ansible.builtin.template:
        src: "templates/scripts/{{ track_stem }}-start.sh.j2"
        dest: "{{ _user_home }}/scripts/{{ track_stem }}-{{ item }}-start.sh"
        mode: "0755"
      vars:
        script_backend: "{{ item }}"
      loop: "{{ launch_backends }}"
      loop_control:
        label: "{{ track_stem }}-{{ item }}-start.sh"
      tags: [podman, launch]

    - name: Ensure pi-configs output directory exists on controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/rendered/pi-configs"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Render pi agent config for Qwen3.8-27B (pi-qwen38-27b-ud-q4-k-xl-podman.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-configs/pi-qwen38-27b-ud-q4-k-xl-podman.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-qwen38-27b-ud-q4-k-xl-podman.json"
        mode: "0644"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp {{ llm_backend }} (Podman) deployed on {{ inventory_hostname }} ====
          Backend: {{ llm_backend }} — scripts rendered for: {{ launch_backends | join(', ') }}
          Image: {{ docker_image }}
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _models_dir }}/{{ model }}
          Drafter: {{ _models_dir }}/{{ mtp_draft_file }} ({{ spec_type }}, n-max {{ spec_draft_n_max | d(3) }})
          KV cache: {{ cache_type_k }} (K) / {{ cache_type_v }} (V) | Batch {{ batch | d(2048) }} / ubatch {{ ubatch | d(512) }} | FA {{ flash_attn | d('on') }} | load {{ load_mode | d('mmap') }}
          GPU layers: {{ n_gpu | d(999) }}
          Context: {{ _docker_ctx_len }}
          Launch scripts:
            ~/scripts/{{ track_stem }}-{{ launch_backends | first }}-start.sh
            ~/scripts/{{ track_stem }}-{{ launch_backends | last }}-start.sh
          Both bind port {{ port }} — stop the running container before starting
          the other backend: podman stop {{ docker_container_name }}

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]