---
# =============================================================================
# base.yml
# ROCm on Ryzen installation for Ubuntu 26.04 (noble)
# Follows: https://rocm.docs.amd.com/projects/radeon-ryzen/en/latest/docs/install/installryz/native_linux/install-ryzen.html
#
# Steps:
#   1. apt upgrade
#   2. Install amdgpu-install from AMD repo
#   3. Install ROCm via amdgpu-install --usecase=rocm --no-dkms
# =============================================================================

- name: "base — ROCm on Ryzen for Ubuntu (noble)"
  hosts: aiservers
  gather_facts: yes
  become: yes
  tags: [base]

  vars:
    amdgpu_install_url: "https://repo.radeon.com/amdgpu-install/7.2.1/ubuntu/noble/amdgpu-install_7.2.1.70201-1_all.deb"

  tasks:
    # --- 1. System upgrade ---
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags: [base, apt]

    # --- 2. Install amdgpu-install ---
    - name: Download amdgpu-install deb
      ansible.builtin.get_url:
        url: "{{ amdgpu_install_url }}"
        dest: /tmp/amdgpu-install.deb
        mode: "0644"
      tags: [base, amdgpu]

    - name: Install amdgpu-install deb
      ansible.builtin.apt:
        deb: /tmp/amdgpu-install.deb
      tags: [base, amdgpu]

    - name: Install ROCm (non-interactive, no DKMS)
      ansible.builtin.command:
        cmd: amdgpu-install -y --usecase=rocm --no-dkms
      tags: [base, amdgpu]

    - name: Clean up amdgpu-install deb
      ansible.builtin.file:
        path: /tmp/amdgpu-install.deb
        state: absent
      tags: [base, amdgpu]

    # --- 3. Summary ---
    - name: Print base bootstrap summary
      ansible.builtin.debug:
        msg: |
          ==== base bootstrap complete on {{ inventory_hostname }} ====
          - System upgraded
          - amdgpu-install installed (AMD repo 7.2.1)
          - ROCm installed (--usecase=rocm --no-dkms)
      tags: [info]
