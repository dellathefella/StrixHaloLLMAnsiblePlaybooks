---
# =============================================================================
# qwen38-flash-next-ud-iq4-xs.yml
# Qwen3.8-Flash-Next (UD-IQ4_XS, ~87 GB, 3-part GGUF) — llama.cpp Vulkan
# Build: PR #27742 (danielhanchen) — Vulkan/RADV (no ROCm kernels for this arch)
# =============================================================================

- name: "bootstrap — qwen38-flash-next: PR #27742 build + model download + render"
  hosts: qwen38-flash-next
  gather_facts: yes
  become: yes
  tags: [qwen38-flash-next]

  vars:
    qwen38_flash_next_ud_iq4_xs_base_url: "https://huggingface.co/{{ qwen38_flash_next_ud_iq4_xs_hf_repo }}/resolve/main/"

  tasks:
    - name: Include Vulkan build dependencies
      ansible.builtin.include_tasks:
        file: tasks/vulkan-build-deps.yml
      tags: [packages, vulkan]
      ignore_errors: yes

    # PR refs are NOT fetched by git's default refspec — the git module
    # alone can never check out refs/pull/27742/head. Clone the repo, then
    # fetch the PR ref explicitly into a remote-tracking ref and branch it.
    # update: no — on an existing repo the ansible git module still calls
    # git reset --hard origin/<current-branch> (switch_version()) when
    # version: HEAD (the default), which fails for local-only branches like
    # qwen4exp-pr27742 that have no upstream.  With update: no the module
    # clones on first run (dest missing) and returns version info on
    # subsequent runs (dest exists), deferring all branch management to the
    # explicit fetch/checkout command tasks below.
    - name: Clone llama.cpp (independent repo for this track)
      ansible.builtin.git:
        repo: "{{ llama_common_repo_url }}"
        dest: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
        update: no
      become: no
      tags: [build]

    - name: Fetch PR #27742 (Qwen4exp architecture support)
      ansible.builtin.command:
        cmd: git fetch origin +refs/pull/27742/head:refs/remotes/origin/pr-27742
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      register: qwen4exp_fetch
      become: no
      changed_when: qwen4exp_fetch.stdout != ''
      tags: [build]

    - name: Check out PR #27742 as local branch
      ansible.builtin.command:
        cmd: git checkout --force -B qwen4exp-pr27742 origin/pr-27742
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      register: qwen4exp_checkout
      become: no
      changed_when: "'Already on' not in qwen4exp_checkout.stdout"
      tags: [build]

    - name: Apply manual patch — add LLM_ARCH_QWEN4EXP to graph_max_nodes()
      ansible.builtin.shell: |
        if ! grep -q 'LLM_ARCH_QWEN4EXP' "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}/src/llama-context.cpp"; then
          sed -i '/case LLM_ARCH_QWEN2:/a\        case LLM_ARCH_QWEN4EXP:' \
            "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}/src/llama-context.cpp"
        fi
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      become: no
      changed_when: false
      failed_when: false
      tags: [build]

    # LLAMA_BUILD_TESTS defaults ON for standalone builds and emits install
    # rules for test binaries — but we only build llama-server/llama-bench,
    # so `cmake --install` would fail on the missing test targets.
    - name: Configure build — Vulkan backend, release
      ansible.builtin.command:
        cmd: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGGML_NATIVE=OFF -DGGML_HIP=OFF -DGGML_VULKAN=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX={{ qwen38_flash_next_ud_iq4_xs_engine_prefix }}
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Build all targets (parallel)
      ansible.builtin.command:
        cmd: "cmake --build build --target llama-server llama-bench -j{{ ansible_processor_vcpus | default(16) }}"
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      become: no
      changed_when: false
      tags: [build]

    # `cmake --install` installs every target that has an install rule (tests,
    # all examples, tools, app) — but we only build llama-server/llama-bench,
    # so it fails on the missing binaries. Copy exactly what the launch
    # script needs instead (bin + runtime shared libs).
    - name: Install llama-server + shared libraries
      ansible.builtin.shell: |
        set -euo pipefail
        prefix="{{ qwen38_flash_next_ud_iq4_xs_engine_prefix }}"
        mkdir -p "$prefix/bin" "$prefix/lib"
        install -m 0755 build/bin/llama-server "$prefix/bin/"
        install -m 0755 build/bin/llama-bench   "$prefix/bin/"
        # fresh copy of the runtime libs (real files + .so symlinks)
        rm -f "$prefix"/lib/libggml*.so* "$prefix"/lib/libllama*.so* "$prefix"/lib/libmtmd*.so*
        cp -P build/bin/libggml*.so* build/bin/libllama*.so* build/bin/libmtmd*.so* "$prefix/lib/"
      args:
        chdir: "{{ qwen38_flash_next_ud_iq4_xs_engine_repo }}"
      become: no
      changed_when: true
      tags: [build]

    - name: Verify llama-server binary
      ansible.builtin.stat:
        path: "{{ qwen38_flash_next_ud_iq4_xs_engine_bin }}"
      register: qwen38_flash_next_bin_stat
      tags: [build]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [qwen38-flash-next] llama-server missing at {{ qwen38_flash_next_ud_iq4_xs_engine_bin }} — build failed."
      when: not qwen38_flash_next_bin_stat.stat.exists

    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ llama_common_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    # 3-part GGUF (~87 GB total) lives in the UD-IQ4_XS/ subfolder of the HF
    # repo. No stat-skip: hf download is idempotent and safe to re-run.
    - name: Download Qwen3.8-Flash-Next UD-IQ4_XS ({{ qwen38_flash_next_ud_iq4_xs_parts | length }} parts, ~87 GB)
      ansible.builtin.command:
        cmd: >-
          hf download {{ qwen38_flash_next_ud_iq4_xs_hf_repo }} {{ qwen38_flash_next_ud_iq4_xs_hf_path }}/{{ item }}
          --local-dir {{ llama_common_models_dir }}
          --token {{ lookup('file', '/home/jdella/Desktop/scripts/rocm-install-z1a-g2/hf_token.txt') }}
      become: no
      changed_when: false
      loop: "{{ qwen38_flash_next_ud_iq4_xs_parts }}"
      loop_control:
        label: "{{ item }}"
      tags: [model, qwen38-flash-next]

    - name: Print qwen38-flash-next track summary
      ansible.builtin.debug:
        msg: |
          ==== qwen38-flash-next track complete ====
          engine: {{ qwen38_flash_next_ud_iq4_xs_engine_bin }} (Vulkan/RADV)
          repo: {{ qwen38_flash_next_ud_iq4_xs_engine_repo }} (PR #27742)
          model: {{ qwen38_flash_next_ud_iq4_xs_parts | join(', ') }} (UD-IQ4_XS, 3-part GGUF, ~87 GB)
          ctx: {{ qwen38_flash_next_ud_iq4_xs_ctx }}, port {{ qwen38_flash_next_ud_iq4_xs_port }}
      tags: [info]

- name: "bootstrap — drop local qwen38-flash-next launch script & pi config"
  hosts: qwen38-flash-next
  gather_facts: yes
  become: no
  run_once: yes
  tags: [launch, qwen38-flash-next]

  tasks:
    - name: Render qwen38-flash-next-ud-iq4-xs-start.sh into ansible/rendered/scripts/
      ansible.builtin.template:
        src: templates/qwen38-flash-next-ud-iq4-xs-start.sh.j2
        dest: "{{ playbook_dir }}/rendered/scripts/qwen38-flash-next-ud-iq4-xs-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, qwen38-flash-next]

    - name: Render pi agent config (pi-qwen38-flash-next-ud-iq4-xs.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-qwen38-flash-next-ud-iq4-xs.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-qwen38-flash-next-ud-iq4-xs.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, qwen38-flash-next]

    - name: Check llama-server binary present
      ansible.builtin.stat:
        path: "{{ qwen38_flash_next_ud_iq4_xs_engine_bin }}"
      delegate_to: localhost
      register: llama_server_stat
      tags: [launch]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [launch] llama-server missing — scripts will not run until build succeeds."
      delegate_to: localhost
      when: not llama_server_stat.stat.exists
      tags: [launch]
