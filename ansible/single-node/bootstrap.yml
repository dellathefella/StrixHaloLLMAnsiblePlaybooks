---
# =============================================================================
# bootstrap.yml — SINGLE-NODE ORCHESTRATOR
#
# Tracks (all run on localhost unless noted):
#   ../shared/install-amdgpu.yml               Ubuntu base: apt upgrade + ROCm via amdgpu-install          [install-amdgpu]
#   ../shared/install-podman.yml               podman installation (Fedora/Debian/Arch)                  [install-podman]
#   ../shared/install-hf-cli.yml               HuggingFace CLI installation                              [install-hf-cli]
#   ../shared/set-grub-ttm.yml                 GRUB kernel args: TTM, IOMMU, GTT size                     [grub-ttm]
#   ../shared/set-limine-ttm.yml               Limine kernel args: TTM, IOMMU, GTT size                   [limine-ttm]
#   qwen36-35b-ud-q8-k-xl-mtp-podman.yml      Qwen3.6-35B-A3B MTP (Podman Vulkan, MTP built into GGUF)   [qwen36-35b-ud-q8-k-xl-mtp-podman]
#   qwen38-27b-laurentz-vulkan-podman.yml     Qwen3.8-27B (LaurentZuijdwijk fork, DFlash2, BUILT FROM SOURCE) [qwen38-27b-laurentz-vulkan-podman]
#   qwen38-flash-next-haloq38-podman.yml      Qwen3.8-Flash-Next (haloq38flash, BUILT FROM SOURCE)       [qwen38-flash-next-haloq38-podman]
#   qwen38-flash-next-halogen-podman.yml     Qwen3.8-Flash-Next (halogen-flash-server, ROCm, PULLED)     [qwen38-flash-next-halogen-podman]
#   gemma-4-26b-a4b-ud-q8-k-xl-podman.yml    Gemma 4 26B A4B (Podman Vulkan, image input)                [gemma-4-26b-a4b-ud-q8-k-xl-podman]
#   summary.yml                                final per-host completion summary                         [summary]
#
# Run from repo root:
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/single-node/bootstrap.yml
#
# Run a single track:
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/single-node/qwen36-35b-ud-q8-k-xl-mtp-podman.yml
#
# Run only amdgpu install + podman install:
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/single-node/bootstrap.yml \
#     --tags install-amdgpu,install-podman
#
# Run only TTM args for GRUB:
#   ansible-playbook -i ansible/single-node/inventory/hosts ansible/shared/set-grub-ttm.yml
#
# Tags select tracks: --tags qwen38-27b-ud-q8-k-xl-podman runs only that track.
# --skip-tags install-amdgpu skips the amdgpu/base play on an already-provisioned host.
# =============================================================================

- name: Import shared — amdgpu/ROCm base
  import_playbook: ../shared/install-amdgpu.yml
  tags: install-amdgpu

- name: Import shared — Podman
  import_playbook: ../shared/install-podman.yml
  tags: install-podman

- name: Import shared — HuggingFace CLI
  import_playbook: ../shared/install-hf-cli.yml
  tags: install-hf-cli

- name: Import shared — GRUB TTM args
  import_playbook: ../shared/set-grub-ttm.yml
  tags: grub-ttm

- name: Import shared — Limine TTM args
  import_playbook: ../shared/set-limine-ttm.yml
  tags: limine-ttm

- name: Track — Qwen3.6-35B-A3B MTP
  import_playbook: qwen36-35b-ud-q8-k-xl-mtp-podman.yml
  tags: [qwen36-35b-ud-q8-k-xl-mtp-podman]

- name: Track — Qwen3.8-27B (LaurentZuijdwijk DFlash2)
  import_playbook: qwen38-27b-laurentz-vulkan-podman.yml
  tags: [qwen38-27b-laurentz-vulkan-podman]

- name: Track — Qwen3.8-Flash-Next (haloq38flash)
  import_playbook: qwen38-flash-next-haloq38-podman.yml
  tags: [qwen38-flash-next-haloq38-podman]

- name: Track — Qwen3.8-Flash-Next (halogen)
  import_playbook: qwen38-flash-next-halogen-podman.yml
  tags: [qwen38-flash-next-halogen-podman]

- name: Track — Gemma 4 26B A4B
  import_playbook: gemma-4-26b-a4b-ud-q8-k-xl-podman.yml
  tags: [gemma-4-26b-a4b-ud-q8-k-xl-podman]

- name: Final per-host summary
  import_playbook: summary.yml
  tags: summary
