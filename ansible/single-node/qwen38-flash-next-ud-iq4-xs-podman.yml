---
# =============================================================================
# qwen38-flash-next-ud-iq4-xs-podman.yml
# Qwen3.8-Flash-Next 125B-A6B (UD-IQ4_XS quantization, 3 shards, ~87 GiB on
# disk) — llama.cpp via Podman, using Nathanw1014's Strix Halo tuned image
# (ghcr.io/nathanw1014/strix-halo-llamacpp:vulkan-v0.7.2). This image bundles
# Flash-Attention and MoE-prefill fixes for gfx1151 plus a tested Mesa driver
# stack.
#
# Uses: ghcr.io/nathanw1014/strix-halo-llamacpp:vulkan-v0.7.2
# Second Flash-Next profile (qwen38-flash-next-ud-q2-k-xl-podman is the first):
#   --ctx-size 131072 (~91 GB resident), --parallel 1, -ngl 999, -fa on,
#   --load-mode none (no mmap), KV cache left at f16, --jinja, --reasoning on,
#   sampler defaults temp 1.0 / top-p 0.95 / top-k 20 / min-p 0.0.
#
# Why the already-pinned image works: the qwen4exp arch landed in llama.cpp
# master with PR #27742 (merged 2026-08-27) and b10666 (2026-08-28, commit
# 4e97ac86) already carries the crash fix that was only a PR comment while the
# branch was open — the LLM_ARCH_QWEN4EXP entry in
# llama_context::graph_max_nodes() (src/llama-context.cpp). Without that entry
# a memory-fit probe can trip GGML_ASSERT(obj_new). So: no PR-branch build and
# no local patch needed; builds older than the merge cannot load this arch.
#
# Keep the KV cache at f16: quantized KV cache asserts and dies on qwen4exp.
# =============================================================================

- name: "podman — setup + deploy llama.cpp container (UD-IQ4_XS)"
  hosts: vulkan
  gather_facts: yes
  become: yes
  tags: [qwen38-flash-next-ud-iq4-xs-podman]

  vars:
    # =====================================================================
    # Qwen3.8-Flash-Next (UD-IQ4_XS) track vars — self-contained, no group_vars
    # =====================================================================

    # Container settings — uses Nathanw1014's pre-built Strix Halo tuned image
    # (Vulkan backend, gfx1151 Flash-Attention + MoE-prefill fixes).
    #   track_stem       → stem used for container name, script names
    track_stem: "qwen38-flash-next-ud-iq4-xs"
    image_repo: "ghcr.io/nathanw1014/strix-halo-llamacpp"
    image_tag: "vulkan-v0.7.2"
    docker_image: "{{ image_repo }}:{{ image_tag }}"
    docker_container_name: "{{ track_stem }}"

    # Model settings — 131072, not the 262144 native ceiling: 87 GiB of weights
    # plus an f16 KV cache is what fits the 128 GB unified pool.
    ctx: 131072
    port: 8080
    parallel: 1
    batch: 2048
    ubatch: 512
    n_gpu: 999
    flash_attn: "on"
    load_mode: "none"
    reasoning: "on"
    temp: "1.0"
    top_p: "0.95"
    top_k: 20
    min_p: "0.0"

    # HF file paths (3 shards, all under the UD-IQ4_XS/ subdir)
    model_shard_1: "UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"
    model_shard_2: "UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00002-of-00003.gguf"
    model_shard_3: "UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00003-of-00003.gguf"
    local_model_dir: "Qwen3.8-Flash-Next-UD-IQ4_XS"
    hf_repo: "unsloth/Qwen3.8-Flash-Next-GGUF"

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('8192') }}"
    _model_dir_path: "{{ _models_dir }}/{{ local_model_dir }}"
    _model_path: "{{ _models_dir }}/{{ local_model_dir }}/{{ model_shard_1 | basename }}"

    # Model download settings — read token on controller
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

  tasks:
    # -----------------------------------------------------------------------
    # 0. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Ensure models directory exists
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        mode: "0755"
      tags: [podman, model]

    - name: Ensure proper ownership of models directory
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        owner: "{{ ansible_env.USER | default('root') }}"
        group: "{{ ansible_env.USER | default('root') }}"
        mode: "0755"
      become: yes
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 1a. Rename UD-IQ4_XS -> Qwen3.8-Flash-Next-UD-IQ4_XS (pre-download)
    # A leftover raw UD-IQ4_XS/ dir from an interrupted run is renamed up front
    # so the shard stat below looks in the right place.
    # -----------------------------------------------------------------------
    - name: Stat UD-IQ4_XS folder
      ansible.builtin.stat:
        path: "{{ _models_dir }}/UD-IQ4_XS"
      register: _pre_rename_stat
      failed_when: false
      tags: [podman, model]

    - name: Rename UD-IQ4_XS folder to Qwen3.8-Flash-Next-UD-IQ4_XS
      ansible.builtin.command:
        cmd: "mv {{ _models_dir }}/UD-IQ4_XS {{ _models_dir }}/{{ local_model_dir }}"
      when:
        - _pre_rename_stat.stat is defined
        - _pre_rename_stat.stat.exists
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2. Download the three shards if not present
    # -----------------------------------------------------------------------
    - name: Check if model shard 1 already exists
      ansible.builtin.stat:
        path: "{{ _model_path }}"
      register: model_file_stat
      tags: [podman, model]

    - name: Print model download status
      ansible.builtin.debug:
        msg: "Checking for model at: {{ _model_path }} | Found: {{ model_file_stat.stat.exists | default('unknown') }}"
      tags: [podman, model]

    - name: Download model shards from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ item }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      loop:
        - "{{ model_shard_1 }}"
        - "{{ model_shard_2 }}"
        - "{{ model_shard_3 }}"
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length > 0
      register: hf_download_result
      loop_control:
        label: "{{ item }}"
      tags: [podman, model]

    - name: Download model shards without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ item }} --local-dir {{ _models_dir }}
      loop:
        - "{{ model_shard_1 }}"
        - "{{ model_shard_2 }}"
        - "{{ model_shard_3 }}"
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length == 0
      register: hf_download_result
      loop_control:
        label: "{{ item }}"
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2a. Rename downloaded folder from HF name to local name
    # -----------------------------------------------------------------------
    - name: Stat HF downloaded folder
      ansible.builtin.stat:
        path: "{{ _models_dir }}/UD-IQ4_XS"
      register: _hf_folder_stat
      failed_when: false
      tags: [podman, model]

    - name: Rename downloaded model folder to local name
      ansible.builtin.command:
        cmd: "mv {{ _models_dir }}/UD-IQ4_XS {{ _models_dir }}/{{ local_model_dir }}"
      when:
        - _hf_folder_stat.stat is defined
        - _hf_folder_stat.stat.exists
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 3. Create and run the Podman container
    # The shard directory is mounted (not just part 1): llama.cpp pulls the
    # other two shards from the directory next to the file it is given.
    # -----------------------------------------------------------------------
    - name: Remove any existing container with the same name
      ansible.builtin.command:
        cmd: "podman rm -f {{ docker_container_name }}"
      ignore_errors: yes
      changed_when: false
      tags: [podman, deploy]

    - name: Run llama.cpp container (Podman, single Vulkan)
      ansible.builtin.command:
        cmd: >-
          podman run -d --name {{ docker_container_name }}
          --rm --pull=newer
          --device=/dev/dri/renderD128
          --device=/dev/kfd
          --privileged
          --entrypoint llama-server
          -v "{{ _model_dir_path }}:{{ _model_dir_path }}:ro"
          -p {{ port }}:{{ port }}
          {{ docker_image }}
          --model {{ _model_path }}
          --host 0.0.0.0
          --port {{ port }}
          --ctx-size {{ _docker_ctx_len }}
          --parallel {{ parallel | d(1) }}
          --n-gpu-layers {{ n_gpu | d(999) }}
          --batch-size {{ batch | d(2048) }}
          --ubatch-size {{ ubatch | d(512) }}
          --flash-attn {{ flash_attn | d('on') }}
          --load-mode {{ load_mode | d('none') }}
          --jinja
          --reasoning {{ reasoning | d('on') }}
          --temp {{ temp }}
          --top-p {{ top_p }}
          --top-k {{ top_k }}
          --min-p {{ min_p }}
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Print container start result
      ansible.builtin.debug:
        msg: "Container started: {{ podman_run_result.stdout | default('unknown') }}"
      when: podman_run_result is defined
      tags: [podman, deploy]

    - name: Check if container is running
      ansible.builtin.command:
        cmd: "podman ps --filter name={{ docker_container_name }} --format json"
      register: container_check
      changed_when: false
      failed_when: false
      tags: [podman, deploy]

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          qwen4exp needs a llama.cpp build at or after the PR #27742 merge
          (2026-08-27) that also carries the LLM_ARCH_QWEN4EXP entry in
          graph_max_nodes() — {{ docker_image }} has both. Keep the KV cache on
          f16 (--cache-type-k/--cache-type-v): quantized KV asserts on qwen4exp.

          To debug, run manually:
            podman run -it --rm --device=/dev/dri/renderD128 --device=/dev/kfd --privileged -v {{ _models_dir }}:{{ _models_dir }}:ro -p {{ port }}:{{ port }} {{ docker_image }} --model {{ _model_path }} --host 0.0.0.0 --port {{ port }} --ctx-size {{ _docker_ctx_len }} --parallel {{ parallel | d(1) }} --n-gpu-layers {{ n_gpu | d(999) }} --batch-size {{ batch | d(2048) }} --ubatch-size {{ ubatch | d(512) }} --flash-attn {{ flash_attn | d('on') }} --load-mode {{ load_mode | d('none') }} --jinja --reasoning {{ reasoning | d('on') }}

          Check GPU access: ls -la /dev/dri/ /dev/kfd
      when: container_check.stdout | default('') | length == 0
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 4. Wait for the server
    # -----------------------------------------------------------------------
    - name: Sleep 10s to let container initialize
      ansible.builtin.command:
        cmd: "sleep 10"
      changed_when: false
      tags: [podman, deploy]

    - name: Wait for llama-server API to respond
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/health"
        return_content: yes
        status_code: 200
      register: health_check
      retries: 120
      delay: 5
      until: health_check is succeeded
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 5. Write launch script to remote host
    # -----------------------------------------------------------------------
    - name: Ensure scripts directory exists on host
      ansible.builtin.file:
        path: "{{ _user_home }}/scripts"
        state: directory
        mode: "0755"
      tags: [podman, launch]

    - name: Render launch script ({{ track_stem }}-start.sh) into ~/scripts/
      ansible.builtin.template:
        src: "templates/scripts/{{ track_stem }}-start.sh.j2"
        dest: "{{ _user_home }}/scripts/{{ track_stem }}-start.sh"
        mode: "0755"
      tags: [podman, launch]

    - name: Ensure pi-configs output directory exists on controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/rendered/pi-configs"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Render pi agent config for Qwen3.8-Flash-Next UD-IQ4_XS (pi-qwen38-flash-next-ud-iq4-xs-podman.json) into rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-configs/pi-qwen38-flash-next-ud-iq4-xs-podman.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-qwen38-flash-next-ud-iq4-xs-podman.json"
        mode: "0644"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }}
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _model_path }} (shard 1 of 3)
          Context: {{ _docker_ctx_len }} — ~91 GB resident, loads in ~45 s
          Loading: --load-mode {{ load_mode | d('none') }} (no mmap), KV cache f16
          Sampling defaults: temp {{ temp }} / top-p {{ top_p }} / top-k {{ top_k }} / min-p {{ min_p }}, reasoning {{ reasoning | d('on') }}
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]



