---
# =============================================================================
# gemma-4-26b-a4b-ud-q8-k-xl-podman.yml
# Gemma 4 26B A4B it (UD-Q8_K_XL quantization, ~27.6 GB) — llama.cpp via Podman,
# using Nathanw1014's Strix Halo tuned image (Vulkan backend, gfx1151
# Flash-Attention + MoE-prefill fixes) WITH IMAGE INPUT (vision) enabled. A
# single launch script is rendered:
#   ~/scripts/gemma-4-26b-a4b-ud-q8-k-xl-start.sh
#
# Uses: ghcr.io/nathanw1014/strix-halo-llamacpp:vulkan
#
# Almost identical to the qwen36-35b-ud-q8-k-xl track (port 8080, ctx 262144,
# batch 256, n-gpu-layers 999) with one addition: the vision projector
# (mmproj) unsloth ships alongside the quant. llama.cpp needs it via --mmproj
# to accept images through the OpenAI-compatible /v1/chat/completions API;
# Gemma 4 26B A4B is on llama.cpp's supported vision list (docs/multimodal.md).
#
# KV cache memory scales with ctx. If the container dies while loading weights
# (128 GB unified pool), lower ctx (e.g. -e ctx=131072) or add
# --cache-type-k/--cache-type-v q8_0 the way the qwen38-27b track does.
# =============================================================================

- name: "podman — setup + deploy llama.cpp container with vision (UD-Q8_K_XL)"
  hosts: vulkan
  gather_facts: yes
  become: yes
  tags: [gemma-4-26b-a4b-ud-q8-k-xl-podman]

  vars:
    # =====================================================================
    # Gemma 4 26B A4B (UD-Q8_K_XL) track vars — self-contained, no group_vars
    # =====================================================================

    # Container settings — uses Nathanw1014's pre-built Strix Halo tuned image
    # (Vulkan backend, gfx1151 Flash-Attention + MoE-prefill fixes).
    #   track_stem       → stem used for container name, script names
    track_stem: "gemma-4-26b-a4b-ud-q8-k-xl"
    image_repo: "ghcr.io/nathanw1014/strix-halo-llamacpp"
    image_tag: "vulkan"
    docker_image: "{{ image_repo }}:{{ image_tag }}"
    docker_container_name: "{{ track_stem }}"

    # Model settings — single GGUF at the repo root, native ctx 262144
    ctx: 262144
    port: 8080
    batch: 256
    model: "gemma-4-26B-A4B-it-UD-Q8_K_XL.gguf"
    hf_repo: "unsloth/gemma-4-26B-A4B-it-GGUF"
    n_gpu: 999

    # Vision projector — enables image recognition. The repo ships three
    # (mmproj-BF16/F16/F32); F16 is the smallest 16-bit one (~1.19 GB) and
    # matches the quant's precision class. It is stored in the repo under a
    # generic name, so we rename it on disk to keep it from ever colliding
    # with another vision track's projector dropped into the same ~/models.
    mmproj_file: "mmproj-F16.gguf"
    mmproj_local: "gemma-4-26B-A4B-it-mmproj-F16.gguf"

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('8192') }}"

    # Model download settings — read token on controller (repo is public,
    # so the no-token path is what normally runs)
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

  tasks:
    # -----------------------------------------------------------------------
    # 1. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Ensure models directory exists
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        mode: "0755"
      tags: [podman, model]

    - name: Ensure proper ownership of models directory
      ansible.builtin.file:
        path: "{{ _models_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      become: yes
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 2. Download model + vision projector if not present
    # -----------------------------------------------------------------------
    - name: Check if model file already exists
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ model }}"
      register: model_file_stat
      tags: [podman, model]

    - name: Check if vision projector already exists
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ mmproj_local }}"
      register: mmproj_local_stat
      tags: [podman, model]

    - name: Print model download status
      ansible.builtin.debug:
        msg: "Checking for model at: {{ _models_dir }}/{{ model }} | Found: {{ model_file_stat.stat.exists | default('unknown') }} | projector {{ mmproj_local }} found: {{ mmproj_local_stat.stat.exists | default('unknown') }}"
      tags: [podman, model]

    - name: Download model from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ model }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length > 0
      register: hf_download_result
      changed_when: "'Downloaded' in hf_download_result.stdout or 'Updated' in hf_download_result.stdout"
      tags: [podman, model]

    - name: Download model without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ model }} --local-dir {{ _models_dir }}
      when:
        - not model_file_stat.stat.exists
        - hf_token_lookup | length == 0
      register: hf_download_result
      changed_when: "'Downloaded' in hf_download_result.stdout or 'Updated' in hf_download_result.stdout"
      tags: [podman, model]

    - name: Download vision projector from HuggingFace (with token)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ mmproj_file }} --token "{{ hf_token_lookup }}" --local-dir {{ _models_dir }}
      when:
        - not mmproj_local_stat.stat.exists
        - hf_token_lookup | length > 0
      register: hf_mmproj_download_result
      changed_when: "'Downloaded' in hf_mmproj_download_result.stdout or 'Updated' in hf_mmproj_download_result.stdout"
      tags: [podman, model]

    - name: Download vision projector without token (public repo)
      ansible.builtin.command:
        cmd: >-
          hf download {{ hf_repo }} {{ mmproj_file }} --local-dir {{ _models_dir }}
      when:
        - not mmproj_local_stat.stat.exists
        - hf_token_lookup | length == 0
      register: hf_mmproj_download_result
      changed_when: "'Downloaded' in hf_mmproj_download_result.stdout or 'Updated' in hf_mmproj_download_result.stdout"
      tags: [podman, model]

    # hf writes the projector under its generic repo name; give it a model
    # specific name so a later vision track can never overwrite it.
    - name: Stat downloaded vision projector
      ansible.builtin.stat:
        path: "{{ _models_dir }}/{{ mmproj_file }}"
      register: mmproj_downloaded_stat
      tags: [podman, model]

    - name: Rename vision projector to model-specific name
      ansible.builtin.command:
        cmd: "mv {{ _models_dir }}/{{ mmproj_file }} {{ _models_dir }}/{{ mmproj_local }}"
      when:
        - mmproj_downloaded_stat.stat.exists
        - not mmproj_local_stat.stat.exists
      tags: [podman, model]

    - name: Fail if vision projector is missing
      ansible.builtin.fail:
        msg: >-
          Image input needs the projector {{ _models_dir }}/{{ mmproj_local }}.
          Download failed — check `hf download {{ hf_repo }} {{ mmproj_file }} --local-dir {{ _models_dir }}`.
      when:
        - not mmproj_local_stat.stat.exists
        - not mmproj_downloaded_stat.stat.exists
      tags: [podman, model]

    # -----------------------------------------------------------------------
    # 3. Create and run the Podman container
    # -----------------------------------------------------------------------
    - name: Remove any existing container with the same name
      ansible.builtin.command:
        cmd: "podman rm -f {{ docker_container_name }}"
      ignore_errors: yes
      changed_when: false
      tags: [podman, deploy]

    - name: Run llama.cpp container (Podman, single Vulkan)
      ansible.builtin.command:
        cmd: >-
          podman run -d --name {{ docker_container_name }}
          --rm --pull=newer
          --device=/dev/dri/renderD128
          --device=/dev/kfd
          --privileged
          --entrypoint llama-server
          -v {{ _models_dir }}:{{ _models_dir }}:ro
          -p {{ port }}:{{ port }}
          {{ docker_image }}
          --model {{ _models_dir }}/{{ model }}
          --mmproj {{ _models_dir }}/{{ mmproj_local }}
          --host 0.0.0.0
          --port {{ port }}
          --ctx-size {{ _docker_ctx_len }}
          --n-gpu-layers {{ n_gpu | d(999) }}
          --batch-size {{ batch | d(256) }}
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Print container start result
      ansible.builtin.debug:
        msg: "Container started: {{ podman_run_result.stdout | default('unknown') }}"
      when: podman_run_result is defined
      tags: [podman, deploy]

    - name: Check if container is running
      ansible.builtin.command:
        cmd: "podman ps --filter name={{ docker_container_name }} --format json"
      register: container_check
      changed_when: false
      failed_when: false
      tags: [podman, deploy]

    - name: Check vision projector lines in container log
      ansible.builtin.shell: >-
        podman logs {{ docker_container_name }} 2>&1 | grep -iE 'mmproj|mtmd|error' | tail -n 10 || true
      register: mmproj_log_lines
      changed_when: false
      failed_when: false
      tags: [podman, deploy]

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).
          
          To debug, run manually:
            podman run -it --rm --device=/dev/dri/renderD128 --device=/dev/kfd --privileged --entrypoint llama-server -v {{ _models_dir }}:{{ _models_dir }}:ro -p {{ port }}:{{ port }} {{ docker_image }} --model {{ _models_dir }}/{{ model }} --mmproj {{ _models_dir }}/{{ mmproj_local }} --host 0.0.0.0 --port {{ port }} --ctx-size {{ _docker_ctx_len }} --n-gpu-layers {{ n_gpu | d(999) }} --batch-size {{ batch | d(256) }}
          
          Image input also needs the projector to load — look for "mmproj"/"mtmd"
          lines above. If the load was killed out of memory, try a smaller ctx
          (e.g. -e ctx=131072) before blaming the model.
          
          Check GPU access: ls -la /dev/dri/ /dev/kfd
      tags: [podman, deploy]

    - name: Sleep 10s to let container initialize
      ansible.builtin.command:
        cmd: "sleep 10"
      changed_when: false
      tags: [podman, deploy]

    - name: Wait for llama-server API to respond
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/health"
        return_content: yes
        status_code: 200
      register: health_check
      retries: 60
      delay: 5
      until: health_check is succeeded
      tags: [podman, deploy]

    # -----------------------------------------------------------------------
    # 5. Write launch script to remote host
    # -----------------------------------------------------------------------
    - name: Ensure scripts directory exists on host
      ansible.builtin.file:
        path: "{{ _user_home }}/scripts"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      tags: [podman, launch]

    - name: Render launch script ({{ track_stem }}-start.sh) into ~/scripts/
      ansible.builtin.template:
        src: "templates/scripts/{{ track_stem }}-start.sh.j2"
        dest: "{{ _user_home }}/scripts/{{ track_stem }}-start.sh"
        mode: "0755"
      tags: [podman, launch]

    - name: Ensure pi-configs output directory exists on controller
      ansible.builtin.file:
        path: "{{ playbook_dir }}/rendered/pi-configs"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Render pi agent config for Gemma 4 26B A4B (pi-gemma-4-26b-a4b-ud-q8-k-xl-podman.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-configs/pi-gemma-4-26b-a4b-ud-q8-k-xl-podman.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-gemma-4-26b-a4b-ud-q8-k-xl-podman.json"
        mode: "0644"
      delegate_to: localhost
      become: no
      tags: [podman, launch]

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          ==== llama.cpp (Podman) deployed on {{ inventory_hostname }} ====
          Image: {{ docker_image }}
          Container: {{ docker_container_name }}
          API endpoint: http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/completion
          Model: {{ _models_dir }}/{{ model }}
          Vision projector: {{ _models_dir }}/{{ mmproj_local }} (image input ON)
          GPU layers: {{ n_gpu | d(999) }}
          Context: {{ _docker_ctx_len }}
          Projector log lines: {{ mmproj_log_lines.stdout | default('none') }}
          Launch script: ~/scripts/{{ track_stem }}-start.sh

          === Image smoke test ===
          curl -s http://localhost:{{ port }}/v1/models | grep -o multimodal
          Send an image through /v1/chat/completions with an "image_url" content part.

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
          View since startup:  podman logs --since 24h {{ docker_container_name }}
      tags: [podman, deploy]
