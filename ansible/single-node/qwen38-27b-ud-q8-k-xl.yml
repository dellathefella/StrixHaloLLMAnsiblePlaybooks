---
# =============================================================================
# qwen38-27b-ud-q8-k-xl.yml
# Qwen3.8-27B (UD-Q8_K_XL, ~27 GB) — llama.cpp ROCm/HIP
#
# Based on KyaniteLabs measured Strix Halo profile:
#   weights: UD-Q8_K_XL @ 262144 ctx, K+V q4_0 KV cache
#   spec: draft-mtp + ngram-mod, n-max 12, n-min 24
#   env: HSA_ENABLE_SDMA=0, HSA_XNACK=1 (GTT pressure guard)
#   batch: 256
#
# Uses its own llama.cpp clone in ~/llama-cpp-qwen38-27b (separate from the
# qwen36 and flash tracks).
# =============================================================================

- name: "bootstrap — qwen38-27b: build + model download + render configs (UD-Q8_K_XL)"
  hosts: qwen38-27b
  gather_facts: yes
  become: yes
  tags: [qwen38-27b]

  vars:
    qwen38_27b_ud_q8_k_xl_url: "https://huggingface.co/{{ qwen38_27b_ud_q8_k_xl_hf_repo }}/resolve/main/{{ qwen38_27b_ud_q8_k_xl_model }}"

  tasks:
    - name: Include ROCm build dependencies
      ansible.builtin.include_tasks:
        file: tasks/rocm-build-deps.yml
      tags: [packages, rocm]

    - name: Clone llama.cpp HEAD (independent repo for this track)
      ansible.builtin.git:
        repo: "{{ llama_common_repo_url }}"
        dest: "{{ qwen38_27b_ud_q8_k_xl_engine_repo }}"
        version: HEAD
        force: yes
      become: no
      tags: [build]

    - name: Configure build — ROCm backend, release, graphs for PP perf
      ansible.builtin.command:
        cmd: >-
          cmake -B build -DGGML_HIP=ON -DGGML_HIP_GRAPHS=ON
          -DGGML_VULKAN=OFF
          -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          -DCMAKE_INSTALL_PREFIX={{ qwen38_27b_ud_q8_k_xl_engine_prefix }}
      args:
        chdir: "{{ qwen38_27b_ud_q8_k_xl_engine_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Build all targets (parallel)
      ansible.builtin.command:
        cmd: "cmake --build build --config Release -j{{ ansible_processor_vcpus | default(16) }}"
      args:
        chdir: "{{ qwen38_27b_ud_q8_k_xl_engine_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Install to {{ qwen38_27b_ud_q8_k_xl_engine_prefix }}
      ansible.builtin.command:
        cmd: "cmake --install build --prefix {{ qwen38_27b_ud_q8_k_xl_engine_prefix }}"
      args:
        chdir: "{{ qwen38_27b_ud_q8_k_xl_engine_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Verify llama-server binary
      ansible.builtin.stat:
        path: "{{ qwen38_27b_ud_q8_k_xl_engine_bin }}"
      register: qwen38_27b_bin_stat
      tags: [build]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [qwen38-27b] llama-server missing at {{ qwen38_27b_ud_q8_k_xl_engine_bin }} — build failed. Check cmake/build logs in {{ qwen38_27b_ud_q8_k_xl_engine_repo }}/build."
      when: not qwen38_27b_bin_stat.stat.exists

    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ llama_common_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    - name: Check if Qwen3.8-27B model already present
      ansible.builtin.stat:
        path: "{{ llama_common_models_dir }}/{{ qwen38_27b_ud_q8_k_xl_model }}"
      register: qwen38_27b_model_stat
      become: no
      tags: [model, qwen38-27b]

    - name: Download Qwen3.8-27B UD-Q8_K_XL ({{ qwen38_27b_ud_q8_k_xl_model }}) [skip if present]
      ansible.builtin.command:
        cmd: >-
          hf download {{ qwen38_27b_ud_q8_k_xl_hf_repo }} {{ qwen38_27b_ud_q8_k_xl_model }}
          --local-dir {{ llama_common_models_dir }}
          --token {{ lookup('file', '/home/jdella/Desktop/scripts/rocm-install-z1a-g2/hf_token.txt') }}
      become: no
      changed_when: false
      when: not qwen38_27b_model_stat.stat.exists
      tags: [model, qwen38-27b]

    - name: Qwen3.8-27B model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [qwen38-27b] {{ qwen38_27b_ud_q8_k_xl_model }} already in {{ llama_common_models_dir }}"
      when: qwen38_27b_model_stat.stat.exists
      tags: [model, qwen38-27b]

    - name: Check downloaded model files present
      ansible.builtin.find:
        paths: "{{ llama_common_models_dir }}"
        patterns: "*.gguf"
      register: model_files
      become: no
      tags: [model, qwen38-27b]

    - name: Warn if model downloads are incomplete
      ansible.builtin.debug:
        msg: "WARNING [model] expected 1 GGUF(s) missing in {{ llama_common_models_dir }} — re-run download."
      when: not (model_files.matched | int >= 1)
      tags: [model, qwen38-27b]

    - name: Print qwen38-27b track summary
      ansible.builtin.debug:
        msg: |
          ==== qwen38-27b track complete on {{ inventory_hostname }} ====
          engine: {{ qwen38_27b_ud_q8_k_xl_engine_bin }} (ROCm/HIP)
          repo: {{ qwen38_27b_ud_q8_k_xl_engine_repo }}
          model: {{ qwen38_27b_ud_q8_k_xl_model }}  ({{ qwen38_27b_ud_q8_k_xl_ctx }} ctx, port {{ qwen38_27b_ud_q8_k_xl_port }})
          Launch later via scripts/qwen38-27b-ud-q8-k-xl-start.sh.
          KyaniteLabs Strix Halo profile — 262k native ctx, q4_0 KV, draft-mtp n=12.
      tags: [info]

# -----------------------------------------------------------------------------
# Launch render — drop local qwen38-27b launch script + pi config
# -----------------------------------------------------------------------------
- name: "bootstrap — drop local qwen38-27b launch script & pi config"
  hosts: qwen38-27b
  gather_facts: yes
  become: no
  run_once: yes
  tags: [launch, qwen38-27b]

  tasks:
    - name: Render qwen38-27b-ud-q8-k-xl-start.sh launch script into ansible/rendered/scripts/
      ansible.builtin.template:
        src: templates/qwen38-27b-ud-q8-k-xl-start.sh.j2
        dest: "{{ playbook_dir }}/rendered/scripts/qwen38-27b-ud-q8-k-xl-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, qwen38-27b]

    - name: Render pi agent config for Qwen3.8-27B (pi-qwen38-27b-ud-q8-k-xl.json) into ansible/rendered/pi-configs/
      ansible.builtin.template:
        src: templates/pi-qwen38-27b-ud-q8-k-xl.json.j2
        dest: "{{ playbook_dir }}/rendered/pi-configs/pi-qwen38-27b-ud-q8-k-xl.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, qwen38-27b]

    - name: Check llama-server binary present
      ansible.builtin.stat:
        path: "{{ qwen38_27b_ud_q8_k_xl_engine_bin }}"
      delegate_to: localhost
      register: llama_server_stat
      tags: [launch]

    - name: Warn if llama-server did not build (scripts will fail)
      ansible.builtin.debug:
        msg: "WARNING [launch] llama-server missing — scripts/qwen38-27b-ud-q8-k-xl-start.sh will not run until the build succeeds."
      delegate_to: localhost
      when: not llama_server_stat.stat.exists
      tags: [launch]
