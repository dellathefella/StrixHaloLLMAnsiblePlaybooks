---
# =============================================================================
# qwen38-27b-rocmfp4-podman.yml
# Qwen3.8-27B (ROCmFP4_FAST quant) on the custom julianmb ROCmFPX llama.cpp
# engine, via the PUBLIC julianmb/q38rocm image on GHCR.
#
# This is the ONLY track that uses a custom (non-Nathanw1014) image. Unlike the
# vanilla llama.cpp tracks (which override --entrypoint and pass raw
# llama-server flags), this image ships its own run_server.sh entrypoint that
# auto-detects Vulkan0/ROCm0 and builds the FULL command from the "speed"
# profile (ctx 128K, MTP speculation, KV K=q8_0/V=turbo4, 128K prompt cache).
# The Strix Halo env (HSA_OVERRIDE_GFX_VERSION=11.5.1, unified memory, ...) is
# set inside the image by setup_env.sh — no -e env flags needed here.
#
# We only: pull the public image (never build), mount the single model file at
# /app/models (read-only), map the host port to the image's fixed port 8000,
# and pass the model path + ctx + slots. Anything in the profile's `extra_args`
# is appended after the image name, so run_server.sh forwards it to llama-server
# as overrides. MTP is BUILT INTO the model (no separate --model-draft drafter
# file, unlike the qwen38-27b-ud-q4-k track).
#
# DeviceLost mitigation (llama.cpp #21724 / #24872 / #27306): the container is
# started with GGML_VK_MAX_NODES_PER_SUBMIT=1 (one graph node per vkQueueSubmit)
# and the host needs the amdgpu ring watchdog raised — see set-grub-ttm /
# set-limine-ttm and the README Troubleshooting section.
#
#   image           ghcr.io/julianmb/q38rocm:1.5.3   (pulled, NOT built)
#   model           Qwen3.8-27B-ROCmFP4-FAST.gguf   (~13.5 GB, ROCmFP4 + MTP)
#   internal port   8000 (fixed by image; HEALTHCHECK checks :8000/health)
#   launch script   ~/scripts/qwen38-27b-rocmfp4-start.sh
# =============================================================================

- name: "podman — setup + deploy ROCmFPX llama.cpp container (ROCmFP4_FAST)"
  hosts: rocm
  gather_facts: yes
  become: yes
  tags: [qwen38-27b-rocmfp4-podman]

  vars:
    track_stem: "qwen38-27b-rocmfp4"

    # =====================================================================
    # Model PROFILE — per-model config (no group_vars). `active_profile` selects
    # which model this track serves; every model-specific knob lives in the
    # profile dict, so a future ROCm track only adds an entry here.
    #   image        → container image to pull and run (repo:tag)
    #   model        → GGUF filename inside the HF repo
    #   hf_repo      → HuggingFace repo that hosts the model file
    #   port         → host port -> container 8000 (one server at a time)
    #   ctx          → server context window (--ctx)
    #   parallel     → number of server slots (--slots)
    # =====================================================================
    active_profile: "qwen38-27b-rocmfp4"
    rocm_image_profiles:
      qwen38-27b-rocmfp4:
        # Public prebuilt image — PULLED, not built (avoids the local ROCm engine
        # build entirely).
        image: "ghcr.io/julianmb/q38rocm:1.5.3"
        model: "Qwen3.8-27B-ROCmFP4-FAST.gguf"
        hf_repo: "julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF"
        port: 8080                    # host port -> container 8000 (shared with the
                                      # other Podman tracks - one server at a time)
        ctx: 131072
        parallel: 1
        # ---- DeviceLost mitigation (llama.cpp #21724 / #24872 / #27306) ----
        # GGML_VK_MAX_NODES_PER_SUBMIT caps how many graph nodes ride in one
        # vkQueueSubmit. On Strix Halo a submit that outruns the amdgpu ring
        # watchdog forces a GPU reset: "radv: context is lost" → mid-prompt
        # vk::DeviceLostError. 1 = one submit per node (upstream #24872 defaults
        # UMA to 1; pinned explicitly, no measurable throughput cost).
        # Set "" to stop passing the env var.
        vk_max_nodes_per_submit: "1"
        # Extra llama-server flags appended after run_server.sh's own args.
        # If long prompts still trip the watchdog with MTP on (#27306), try:
        #   -e extra_args='--spec-type none'   (drops the per-ubatch draft decode)
        #   -e extra_args='--ubatch-size 512'  (smaller flash-attn submits)
        #   -e extra_args='--flash-attn off'   (last resort — slow prefill)
        extra_args: ""

    # Derived from the active profile — keeps `image_repo`/`image_tag` semantics for
    # anything that still references them, plus the flat container/server settings
    # the tasks use below.
    profile: "{{ rocm_image_profiles[active_profile] }}"
    image_repo: "{{ profile.image.split(':')[0] }}"
    image_tag: "{{ profile.image.split(':')[1] }}"
    docker_image: "{{ profile.image }}"
    docker_container_name: "{{ track_stem }}"
    container_internal_port: 8000    # fixed by the image (run_server.sh + HEALTHCHECK)
    model: "{{ profile.model }}"
    hf_repo: "{{ profile.hf_repo }}"
    port: "{{ profile.port }}"
    ctx: "{{ profile.ctx }}"
    parallel: "{{ profile.parallel }}"
    vk_max_nodes_per_submit: "{{ profile.vk_max_nodes_per_submit | d('1') }}"
    extra_args: "{{ profile.extra_args | d('') }}"
    # Expands to "-e NAME=VAL" only when the knob is set ("" disables it).
    vk_env: "{{ (' -e GGML_VK_MAX_NODES_PER_SUBMIT=' ~ vk_max_nodes_per_submit) if vk_max_nodes_per_submit | d('') | string | length > 0 else '' }}"

    # The model is mounted at /app/models (read-only). The image's prompt-cache
    # checkpoints go to /app/cache/slots (writable container fs), NOT here.
    _models_mount: "/app/models"

    # Directories — when become: yes is set, ansible_env.HOME becomes /root.
    # Use ansible_user (original login user) to compute the correct home dir.
    _user_home: "/home/{{ ansible_user }}"
    _models_dir: "{{ _user_home }}/models"
    _docker_ctx_len: "{{ ctx | d('131072') }}"

    # HF token (optional — repo is public, works without one)
    hf_token_lookup: "{{ lookup('file', playbook_dir + '/../secrets/hf_token.txt') | trim }}"

    hf_download_items:
      - { repo: "{{ hf_repo }}", file: "{{ model }}", dest_dir: "{{ _models_dir }}" }

    # Everything after the run-mode flags (-d --name X / -it), shared between
    # the real launch and the manual debug hint below — keeps them from drifting.
    _podman_common_args: >-
      --device=/dev/dri/renderD128
      --device=/dev/kfd
      --privileged
      -v {{ _models_dir }}:{{ _models_mount }}:ro
      -p {{ port }}:{{ container_internal_port }}
      {{ vk_env }}
      {{ docker_image }}
      {{ _models_mount }}/{{ model }}
      --ctx {{ _docker_ctx_len }}
      --slots {{ parallel | d(1) }}
      {{ extra_args }}

  tasks:
    # -----------------------------------------------------------------------
    # 1. Ensure models directory exists
    # -----------------------------------------------------------------------
    - name: Set up models directory
      ansible.builtin.include_tasks: tasks/podman-models-dir.yml

    # -----------------------------------------------------------------------
    # 2. Download model if not present (single file; MTP is built in)
    # -----------------------------------------------------------------------
    - name: Download model
      ansible.builtin.include_tasks: tasks/hf-download-files.yml

    # -----------------------------------------------------------------------
    # 3. (Re)start the container — image is PULLED (never built); its
    #    run_server.sh entrypoint builds the full speed-profile command.
    # -----------------------------------------------------------------------
    - name: Remove any existing container
      ansible.builtin.include_tasks: tasks/podman-remove-container.yml

    - name: Run llama.cpp container (ROCmFPX, prebuilt julianmb/q38rocm image)
      ansible.builtin.command:
        cmd: "podman run -d --name {{ docker_container_name }} --rm --pull=newer {{ _podman_common_args }}"
      register: podman_run_result
      changed_when: "'Started' in podman_run_result.stdout or podman_run_result.rc == 0"
      tags: [podman, deploy]

    - name: Check container status
      ansible.builtin.include_tasks: tasks/podman-check-running.yml

    - name: Print container failure info
      ansible.builtin.debug:
        msg: |
          Container {{ docker_container_name }} is NOT running or was removed (has --rm flag).

          To debug, run manually:
            podman run -it --rm {{ _podman_common_args }}

          Check GPU access: ls -la /dev/dri/ /dev/kfd
      tags: [podman, deploy]

    - name: Wait for the server to come up
      ansible.builtin.include_tasks: tasks/podman-wait-health.yml

    # -----------------------------------------------------------------------
    # 4. Write launch script + pi config
    # -----------------------------------------------------------------------
    - name: Render launch script + pi config
      ansible.builtin.include_tasks: tasks/podman-render-launch-artifacts.yml

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          === {{ track_stem }} deployed ===
          Container:  {{ docker_container_name }}
          Image:      {{ docker_image }} (pulled, not built)
          Model:      {{ _models_dir }}/{{ model }}  (mounted at {{ _models_mount }})
          Port:       {{ port }} (host) -> {{ container_internal_port }} (container)
          Context:    {{ _docker_ctx_len }} | Slots: {{ parallel | d(1) }} | MTP: built-in
          Vulkan:     nodes-per-submit pin: {{ vk_max_nodes_per_submit | default('off', true) }} | extra llama-server args: {{ extra_args | default('(none)', true) }}
          API:        http://{{ ansible_host | default(inventory_hostname) }}:{{ port }}/v1
          Launch script: ~/scripts/{{ track_stem }}-start.sh
          Pi config:    rendered/pi-configs/pi-{{ track_stem }}-podman.json

          === Container log commands ===
          View logs:  podman logs -f {{ docker_container_name }}
          Tail last 100 lines:  podman logs --tail 100 {{ docker_container_name }}
      tags: [podman, deploy]
