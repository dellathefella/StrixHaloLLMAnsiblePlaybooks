- name: "bootstrap — step35flash: llama.cpp source build + Step 3.5 Flash IQ4_XS"
  hosts: llama
  gather_facts: yes
  become: yes
  tags: [llama]

  vars:
    llama_repo_url: "https://github.com/ggml-org/llama.cpp.git"
    llama_build_deps:
      - cmake
      - libvulkan-dev     # Vulkan headers + ICD loader (vulkan.h)
      - glslang-tools
      - glslc             # provides glslc (Vulkan shader compiler) for llama.cpp
      - spirv-headers     # SPIRV-HeadersConfig.cmake — required by ggml-vulkan CMake
    step35flash_url: "https://huggingface.co/{{ step35flash_repo }}/resolve/main/{{ step35flash_model }}"

  tasks:
    - name: Install llama.cpp build dependencies
      ansible.builtin.apt:
        name: "{{ llama_build_deps }}"
        state: present
        update_cache: yes

    - name: Clone latest llama.cpp (HEAD)
      ansible.builtin.git:
        repo: "{{ llama_repo_url }}"
        dest: "{{ llama_repo }}"
        depth: 1
        version: HEAD
        force: yes
      become: no

    - name: Configure build — Vulkan backend (Mesa RADV), release
      ansible.builtin.command:
        cmd: >-
          cmake -B build -DGGML_VULKAN=ON -DGGML_HIP=OFF
          -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          -DCMAKE_INSTALL_PREFIX={{ llama_prefix }}
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Build all targets (parallel)
      ansible.builtin.command:
        cmd: "cmake --build build --config Release -j{{ ansible_processor_vcpus | default(16) }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Install to {{ llama_prefix }} (full install)
      # Full cmake --install needs every target built (it references test
      # binaries like test-tokenizer-0); build above covers all of them.
      ansible.builtin.command:
        cmd: "cmake --install build --prefix {{ llama_prefix }}"
      args:
        chdir: "{{ llama_repo }}"
      become: no
      changed_when: false
      tags: [build]

    - name: Verify llama-server binary
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_bin_stat
      tags: [build]

    - name: Warn if llama-server did not build
      ansible.builtin.debug:
        msg: "WARNING [llama] llama-server missing at {{ llama_bin }} — build failed. Check the cmake/build logs in {{ llama_repo }}/build."
      when: not llama_bin_stat.stat.exists

    - name: Create model storage directory
      ansible.builtin.file:
        path: "{{ llama_models_dir }}"
        state: directory
        mode: "0755"
      become: no

    - name: Check if Step 3.5 Flash model already present
      ansible.builtin.stat:
        path: "{{ llama_models_dir }}/{{ step35flash_model }}"
      register: step35flash_stat
      become: no
      tags: [model, step35flash]

    - name: Download Step 3.5 Flash IQ4_XS ({{ step35flash_model }}) [skip if present]
      ansible.builtin.command:
        cmd: >-
          aria2c -x 16 -s 16 --file-allocation=none
          --continue=true --allow-overwrite=true
          -o {{ step35flash_model }}
          {{ step35flash_url }}
      args:
        chdir: "{{ llama_models_dir }}"
      become: no
      changed_when: false
      when: not step35flash_stat.stat.exists
      tags: [model, step35flash]

    - name: Step 3.5 Flash model already present — skipping download
      ansible.builtin.debug:
        msg: "SKIP [step35flash] {{ step35flash_model }} already in {{ llama_models_dir }}"
      when: step35flash_stat.stat.exists
      tags: [model, step35flash]

    - name: Check downloaded model files present
      ansible.builtin.find:
        paths: "{{ llama_models_dir }}"
        patterns: "*.gguf"
      register: model_files
      become: no
      tags: [model, step35flash]

    - name: Warn if model downloads are incomplete
      ansible.builtin.debug:
        msg: "WARNING [model] expected 1 GGUF(s) missing in {{ llama_models_dir }} — re-run download."
      when: not (model_files.matched | int >= 1)
      tags: [model, step35flash]

    - name: Print step35flash track summary
      ansible.builtin.debug:
        msg: |
          ==== step35flash track complete on {{ inventory_hostname }} ====
          engine: {{ llama_bin }}
          model: {{ step35flash_model }}  ({{ step35flash_ctx }} ctx, port {{ step35flash_port }})
          Launch later via scripts/step35flash-start.sh.
          Vulkan (Mesa RADV) backend — fastest tg + MoE pp on Strix Halo.
      tags: [info]

# -----------------------------------------------------------------------------
# Launch render — drop local step35flash launch script + pi config
# -----------------------------------------------------------------------------
- name: "bootstrap — drop local step35flash launch script & pi config"
  hosts: llama
  gather_facts: yes
  become: no
  run_once: yes
  tags: [launch, llama]

  tasks:
    - name: Render step35flash-start.sh launch script into scripts/
      ansible.builtin.template:
        src: templates/step35flash-start.sh.j2
        dest: "{{ playbook_dir }}/../scripts/step35flash-start.sh"
        mode: "0755"
      delegate_to: localhost
      tags: [launch, step35flash]

    - name: Render pi agent config for Step 3.5 Flash (pi-step35flash.json) into pi-configs/
      ansible.builtin.template:
        src: templates/pi-step35flash.json.j2
        dest: "{{ playbook_dir }}/../pi-configs/pi-step35flash.json"
        mode: "0644"
      delegate_to: localhost
      tags: [launch, step35flash]

    - name: Check llama-server binary present
      ansible.builtin.stat:
        path: "{{ llama_bin }}"
      register: llama_server_stat
      delegate_to: localhost
      tags: [launch]

    - name: Warn if llama-server did not build (scripts will fail)
      ansible.builtin.debug:
        msg: "WARNING [launch] llama-server missing — scripts/step35flash-start.sh will not run until the build succeeds."
      delegate_to: localhost
      when: not llama_server_stat.stat.exists
      tags: [launch]
