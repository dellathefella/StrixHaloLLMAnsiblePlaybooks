# =============================================================================
# ROCm build dependencies for llama.cpp (HIP backend)
#
# All llama.cpp tracks import this task file to ensure HIP runtime + dev
# packages are present before building.  These are the minimal set required
# by llama.cpp's CMake config when `-DGGML_HIP=ON` is set.
#
# See: https://rocm.docs.amd.com/projects/install-on-linux/en/docs-7.2.4/
# =============================================================================

- name: Install ROCm build dependencies (HIP toolkit headers + runtime)
  # No Vulkan needed — llama.cpp is built ROCm-only.
  ansible.builtin.apt:
    name:
      - cmake                     # CMake build system
      - rocminfo                  # rocminfo binary for GPU probe
      - rocblas                   # rocBLAS (matrix multiply)
      - hipblas                   # hipBLAS (vector ops)
      - hipfft                    # hipFFT (attention kernel)
      - hipsolver                 # hipSOLVER (eigen, svd)
      - hipsparse                 # hipSPARSE (sparse ops)
      - hipcub                    # HIPCUB
      - miopen-hip                # MIOpen (conv)
    state: present
    update_cache: yes
  tags: [packages, rocm]
