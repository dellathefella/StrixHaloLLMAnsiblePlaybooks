---
# Defaults for all hosts. These are LOWER precedence than per-host inventory
# vars (e.g. `ds4_ctx_single=131072` on a host line still overrides here).
# Structural vars (homes, engine dirs, model filenames) are also here — one
# source of truth shared by the download (PLAY 1) and template-render (PLAY 2)
# tasks of each track playbook.

# --- DS4 (single-node default + multi-node optional) ---
ds4_mode: "single"      # single | multi
ds4_ctx_single: 126000  # AMD guide: IQ2_XXS (~80.8 GB) at 126k context on a 128 GB node
                        # (shared pool >=110 GB; our GRUB ttm.pages_limit gives ~124 GB)
ds4_ctx: 262144         # multi-node Q4KExperts context (both nodes MUST match)
ds4_port: 8000
ds4_host: "127.0.0.1"   # single-node endpoint; set 0.0.0.0 to expose on LAN,
                        # or the coordinator LAN IP for multi-node
ds4_coord_ip: ""        # coordinator LAN IP (multi-node; workers + pi config need it)
ds4_coord_port: 8081    # coordinator worker-listen port
ds4_download_single: 1
ds4_download_multi: 0
ds4_download_mtp: 0

# --- DS4 structural paths + model filenames (single source of truth) ---
ds4_home: "/home/{{ ansible_user }}"   # ansible_user must be set in inventory
ds4_models_dir: "{{ ds4_home }}/ds4"
ds4_single_model: "DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf"   # antirez/deepseek-v4-gguf (~80.8 GB)
ds4_multi_model: "DeepSeek-V4-Flash-Q4KExperts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2-imatrix.gguf"   # (~153 GB)
ds4_mtp_model: "DeepSeek-V4-Flash-MTP-Q4K-Q8_0-F32.gguf"   # (~3.6 GB, optional)
ds4_toolbox_single: "docker.io/kyuz0/strix-halo-ds4-toolbox:rocm-7.14"
ds4_toolbox_multi: "docker.io/kyuz0/strix-halo-ds4-toolbox:multi-node-rocm-7.14"

# --- Qwen RCCL (cluster; unchanged) ---
qwen_port: 7000
qwen_max_model_len: 65536
qwen_head_ip: ""
qwen_worker_ip: ""

# --- llama.cpp track: Qwen3.6-35B-A3B + Gemma4-E4B (Q4_K_S) ---
qwen36_ctx: 131072   # 8-bit 38.5 GB; Qwen3.6 needs >=128k ctx to preserve thinking
gemma_e4b_ctx: 131072  # 4.5B eff / 8B total (PLE) — 128K native ctx; Q4_K_S ~4.8 GB
gemma_e4b_port: 8083

gemma_e4b_host: "127.0.0.1"
gemma_e4b_device: "Vulkan0"
gemma_e4b_batch: 512     # dense model — large batch for max tg throughput
gemma_e4b_ubatch: 1024   # ubatch >> ctx for best memory bandwidth utilization
gemma_e4b_flash_attn: 1
gemma_e4b_mmap: 0
gemma_e4b_threads: 32    # full 16C/32T Strix Halo utilization
qwen36_port: 8081
qwen36_device: "Vulkan0"
qwen36_batch: 256
qwen36_ubatch: 512
qwen36_flash_attn: 1
qwen36_mmap: 0

# --- llama.cpp structural paths + model filenames (single source of truth) ---
llama_home: "/home/{{ ansible_user }}"
llama_repo: "{{ llama_home }}/llama-cpp"          # git clone ggml-org/llama.cpp -> llama-cpp
llama_prefix: "{{ llama_home }}/llama-cpp"        # cmake --install prefix
llama_bin: "{{ llama_home }}/llama-cpp/bin/llama-server"
llama_models_dir: "{{ llama_home }}/.local/share/llama-models"
qwen36_host: "127.0.0.1"
qwen36_model: "Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf"     # unsloth/Qwen3.6-35B-A3B-GGUF (~38.5 GB)
qwen36_repo: "unsloth/Qwen3.6-35B-A3B-GGUF"
gemma_e4b_model: "gemma-4-E4B-it-Q4_K_S.gguf"       # unsloth/gemma-4-E4B-it-GGUF (~4.8 GB)
gemma_e4b_repo: "unsloth/gemma-4-E4B-it-GGUF"

# --- Laguna S 2.1 (Chadrock ROCmFP4 StrixKVSpine V4) ---
# Ciru ROCmFPX Runtime V3 — NOT stock upstream llama.cpp.
# AMD-optimized ROCmFP4 quant at 4.453 BPW for Strix Halo (gfx1151).
# 118B total / ~8B active, 60.945 GiB, 131K validated context.
laguna_port: 8082
laguna_host: "127.0.0.1"
laguna_ctx: 131072
laguna_model: "laguna-s-2.1-ROCmFP4-StrixKVSpine-v4.gguf"
laguna_sha256: "ea1d854a72c47ec8e72c16ea91b8ff3cd5e1620b834df175f683c86f27dc26d6"
laguna_repo: "jcbtc/Laguna-S-2.1-Chadrock-ROCmFP4-StrixKVSpine-V4-GGUF"
laguna_repo_url: "https://github.com/ciru-ai/ROCmFPX.git"
laguna_branch: "agent/laguna-s21-runtime-v3"
laguna_commit: "54f5fe06c74350fb8b6aec21d8749071bc195bdb"
laguna_home: "{{ llama_home }}/rocml-fpx"           # Ciru ROCmFPX Runtime V3 fork
laguna_bin: "{{ laguna_home }}/build-laguna-strix-vulkan/bin/llama-server"
laguna_bin_dir: "{{ laguna_home }}/build-laguna-strix-vulkan/bin"
laguna_vulkan_nodes: 10             # GGML_VK_MAX_NODES_PER_SUBMIT — V2 stability fix
laguna_vulkan_fa_wg: 4              # GGML_VK_FA_MAX_WORKGROUPS_X_PER_DISPATCH — V2 fix
laguna_threads: 16
laguna_batch: 2048                  # V3 validated profile
laguna_ubatch: 512                  # V3 validated profile
laguna_sampler_temperature: 1.0
laguna_sampler_top_p: 1.0
laguna_sampler_top_k: 20
laguna_sampler_min_p: 0.0
laguna_sampler_repeat_penalty: 1.0
laguna_sampler_seed: 42
